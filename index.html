<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SLO Points Squares</title>
<meta name="description" content="Run a football squares points game for fun. No money, wagers, or cash prizes. Firebase keeps every phone synchronized.">
<meta name="theme-color" content="#EFEDE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SLO Points">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --font-display:'Archivo Black','Arial Black','Helvetica Neue',sans-serif;
  --font-body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;

  --r-sm:4px; --r-md:10px; --r-lg:18px;

  --bg:#EFEDE6;
  --surface:#F8F7F3;
  --surface-2:#E7E4DA;
  --line:#D2CFC4;
  --line-strong:#B4AF9F;
  --ink:#1A1F1D;
  --ink-2:#5F6863;
  --ink-3:#8A928C;
  --accent:#E9A900;
  --accent-ink:#221900;
  --accent-text:#7E5A00;
  --accent-soft:#F7E8BC;
  --danger:#C43B24;
  --danger-soft:#F6DCD6;
  --ok:#2F7D5B;
  --shadow:0 1px 2px rgba(26,31,29,.08),0 8px 24px rgba(26,31,29,.06);
  --sheet-shadow:0 -8px 40px rgba(26,31,29,.18);
  --cell:clamp(24px,7.2vw,54px);

  --tx:#97233F; --tx-ink:#FFF9F0;
  --ty:#0085CA; --ty-ink:#FFF9F0;
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --bg:#101614;
    --surface:#18211F;
    --surface-2:#212D2A;
    --line:#2D3D39;
    --line-strong:#435A54;
    --ink:#E9EFEC;
    --ink-2:#A2B2AC;
    --ink-3:#76867F;
    --accent:#F2B705;
    --accent-ink:#0F1412;
    --accent-text:#F2B705;
    --accent-soft:#2E2A12;
    --danger:#F06A50;
    --danger-soft:#3A1E17;
    --ok:#5CC391;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.4);
    --sheet-shadow:0 -8px 40px rgba(0,0,0,.6);
  }
}
html[data-theme="dark"]{
  --bg:#101614;
  --surface:#18211F;
  --surface-2:#212D2A;
  --line:#2D3D39;
  --line-strong:#435A54;
  --ink:#E9EFEC;
  --ink-2:#A2B2AC;
  --ink-3:#76867F;
  --accent:#F2B705;
  --accent-ink:#0F1412;
  --accent-text:#F2B705;
  --accent-soft:#2E2A12;
  --danger:#F06A50;
  --danger-soft:#3A1E17;
  --ok:#5CC391;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.4);
  --sheet-shadow:0 -8px 40px rgba(0,0,0,.6);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100dvh;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}

.wrap{max-width:760px;margin:0 auto;padding:0 14px 120px}

/* Header */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--bg);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(150%) blur(12px);
  border-bottom:none;
  padding-top:env(safe-area-inset-top);
}
.topbar::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--ty) 0%,var(--ty) 46%,var(--accent) 50%,var(--tx) 54%,var(--tx) 100%);
}
.topbar-in{max-width:760px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--font-display);font-size:15px;letter-spacing:-.02em;text-transform:uppercase}
.brand .sq{
  width:26px;height:26px;border-radius:var(--r-sm);
  background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-size:9.5px;letter-spacing:0;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);
}
.spacer{flex:1}
.iconbtn{
  min-height:34px;padding:0 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:5px;
}
.iconbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.iconbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Matchup strip */
.matchup{display:flex;align-items:stretch;gap:8px;margin:14px 0 10px}
.team{
  flex:1;min-width:0;background:var(--tc);color:var(--tci);
  border:none;border-radius:var(--r-md);padding:10px 11px;position:relative;overflow:hidden;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.22), var(--shadow);
  display:flex;align-items:center;gap:9px;
}
.tmeta{min-width:0;flex:1}
.tlogo{width:34px;height:34px;object-fit:contain;flex:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.picklogo{width:26px;height:26px;object-fit:contain;vertical-align:-7px;margin-right:7px}
.iconbtn.theme{gap:6px;font-size:12px}
.iconbtn.theme span:first-child{font-size:13px;line-height:1}
@media (max-width:379px){ .brand .word{display:none} }
.team .axis{font-family:var(--font-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;opacity:.72}
.team .nm{font-family:var(--font-display);font-size:16px;line-height:1.15;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.team .sc{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--font-display);font-size:26px;opacity:.28;letter-spacing:-.04em}
.vs{align-self:center;font-family:var(--font-display);font-size:12px;color:var(--ink-3);letter-spacing:.02em}

/* Sold bar */
.progress{position:relative;height:26px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-bottom:11px;border:1px solid var(--line)}
.progress .bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--ty),var(--tx));transition:width .5s cubic-bezier(.3,1,.4,1)}
.progress .lb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font-mono);font-size:11.5px;font-weight:600;color:var(--ink);mix-blend-mode:normal}
.progress .lb b{font-family:var(--font-display);font-size:13px}

/* Info row */
.inforow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{
  font-family:var(--font-mono);font-size:11.5px;font-weight:500;
  border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;color:var(--ink-2);
}
.chip b{color:var(--ink);font-weight:600}
.chip.live{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.chip.warn{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.chip.pot{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}

/* Board */
.boardcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 12px 14px;box-shadow:var(--shadow)}
.boardhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.boardhead h2{font-family:var(--font-display);font-size:13px;letter-spacing:.02em;text-transform:uppercase;margin:0}
.boardscroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;margin:0 -2px;padding:0 2px}
.grid{
  display:grid;
  gap:3px;
  width:100%;
  margin:0 auto;
  transition:opacity .18s ease;
}
.grid.settling{opacity:0}
.boardscroll.zoomed .grid{width:auto;min-width:var(--zoomw,100%)}
.grid.c10 .sq{font-size:clamp(8px,2.6vw,15px)}
.grid.c10 .gcell.axis{font-size:clamp(11px,3.4vw,20px)}
.grid.c10 .gcell.axis.multi{font-size:clamp(8px,2.4vw,14px)}
.grid.c5 .sq{font-size:clamp(13px,5vw,30px)}
.grid.c5 .gcell.axis{font-size:clamp(16px,6vw,34px)}
.grid.c5 .gcell.axis.multi{font-size:clamp(12px,4.2vw,24px)}
.gcell{
  aspect-ratio:1;border-radius:clamp(4px,1.1vw,9px);position:relative;min-width:0;
  display:grid;place-items:center;font-family:var(--font-mono);
  background:var(--surface-2);border:1px solid transparent;color:var(--ink-3);
  transition:transform .16s cubic-bezier(.3,1,.4,1), background .22s ease, box-shadow .22s ease, color .22s ease;
}
.gcell.corner{background:transparent}
.gcell.axis{
  background:transparent;font-weight:700;
  border:2px dashed var(--ax,var(--line));
  color:var(--ax,var(--ink-3));
}
.gcell.axis.set{
  border:none;background:var(--ax);color:var(--axi);
  font-family:var(--font-display);letter-spacing:-.03em;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.24);
}
.gcell.axis.multi{letter-spacing:-.06em}
.gcell.axis.set.multi{word-spacing:-1px}
.gcell.axis.rolling{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);border-style:solid}
.gcell.axis.pop{animation:pop .34s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.14)}100%{transform:scale(1)}}

.sq{
  background:var(--surface);border:1px solid var(--line);
  color:var(--ink-3);overflow:hidden;
}
.sq:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.sq.taken{
  background:var(--pc);border-color:transparent;
  color:var(--pi);font-weight:700;
  font-family:var(--font-display);font-size:clamp(7.5px,2.2vw,11px);
  letter-spacing:-.03em;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.26);
}
.sq.pending{
  background:repeating-linear-gradient(135deg,var(--pc),var(--pc) 4px,rgba(0,0,0,.22) 4px,rgba(0,0,0,.22) 8px);
  border:2px dashed var(--surface);color:var(--pi);font-weight:700;
}
.sq.unpaid{box-shadow:inset 0 0 0 3px var(--surface), inset 0 -3px 0 rgba(0,0,0,.26)}
.sq.mine{outline:2px solid var(--ink);outline-offset:-3px}
.sq.win{
  border-color:transparent;z-index:3;
  box-shadow:0 0 0 3px var(--accent), inset 0 -3px 0 rgba(0,0,0,.26);
  animation:winpulse 1.9s ease-in-out infinite;
}
.sq.fresh{animation:landed .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes winpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes landed{0%{transform:scale(.4) rotate(-14deg);opacity:.2}70%{transform:scale(1.16) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
.sq .tag{
  position:absolute;top:-1px;right:-1px;background:var(--accent);color:var(--accent-ink);
  font-family:var(--font-mono);font-size:8px;font-weight:600;line-height:1;
  padding:2px 3px;border-radius:0 var(--r-sm) 0 var(--r-sm);
}
.sq .tag.rev{background:var(--ink);color:var(--surface)}
.sq:active{transform:scale(.94)}
.axislabel{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);display:flex;align-items:center;gap:6px;
}
.axislabel .dashline{flex:1;height:1px;background:var(--line)}
.rowlabel{writing-mode:vertical-rl;transform:rotate(180deg)}

/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:3px 9px 3px 4px}
.lg .sw{width:16px;height:16px;border-radius:var(--r-sm);background:var(--c);flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.24)}
.lg b{color:var(--ink);font-weight:600;font-family:var(--font-mono);font-size:11px}

/* Sections */
section{margin-top:18px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 9px}
.sechead h2{font-family:var(--font-display);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;margin:0;color:var(--ink);display:flex;align-items:center;gap:7px}
.sechead h2::before{content:"";width:9px;height:16px;border-radius:2px;background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px;box-shadow:var(--shadow)}
.card + .card{margin-top:9px}

/* Payout rows */
.prow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none;padding-bottom:0}
.prow:first-child{padding-top:0}
.prow .lbl{font-weight:600;font-size:14px}
.prow .amt{font-family:var(--font-mono);font-size:15px;font-weight:600;text-align:right;white-space:nowrap}
.scorepills{display:flex;gap:5px;align-items:center}
.pill{
  font-family:var(--font-display);font-size:15px;letter-spacing:-.02em;
  padding:3px 10px;border-radius:var(--r-sm);background:var(--c);color:var(--ci);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.24);min-width:44px;text-align:center;
}
.pill.blank{background:var(--surface-2);color:var(--ink-3);box-shadow:none;font-family:var(--font-mono);font-size:11px}
.prow .sub{grid-column:1/-1;font-size:12.5px;color:var(--ink-2);margin-top:-2px}
.prow .sub b{color:var(--ink);font-weight:600}
.prow.hit{background:var(--accent-soft);margin:0 -13px;padding:9px 13px;border-radius:var(--r-md);border-bottom-color:transparent}
.prow.hit .lbl{color:var(--accent-text)}

/* Roster */
.rrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:none}
.rrow .dot{
  width:30px;height:24px;border-radius:var(--r-sm);background:var(--pc);color:var(--pi);flex:none;
  display:grid;place-items:center;font-family:var(--font-display);font-size:9.5px;letter-spacing:-.02em;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.24);
}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
#confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:1px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(104vh) rotate(760deg);opacity:.15}}
.rrow .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .ct{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2)}
.rrow .owe{font-family:var(--font-mono);font-size:13px;font-weight:600;min-width:62px;text-align:right}
.rrow .owe.clear{color:var(--ok)}

.empty{text-align:left;padding:22px 4px;color:var(--ink-2);font-size:14px}
.empty strong{display:block;font-family:var(--font-display);font-size:16px;color:var(--ink);margin-bottom:5px;letter-spacing:-.01em}

/* Buttons */
.btn{
  min-height:44px;padding:0 16px;border-radius:var(--r-md);font-weight:600;font-size:14.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:inset 0 -3px 0 rgba(0,0,0,.24)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.full{width:100%}
.btn.sm{min-height:34px;font-size:13px;padding:0 11px;border-radius:var(--r-sm)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1;min-width:120px}

/* Fields */
.field{margin-bottom:11px}
.field label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;min-height:44px;padding:10px 12px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--bg);color:var(--ink);
}
.field textarea{min-height:88px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.field .hint{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.4}
.field.err input{border-color:var(--danger)}
.field .errmsg{font-size:12.5px;color:var(--danger);margin-top:5px;display:none}
.field.err .errmsg{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input[type="color"]{padding:3px;height:44px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,13,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;
  box-shadow:var(--sheet-shadow);border-top:1px solid var(--line);
  transform:translateY(102%);transition:transform .26s cubic-bezier(.3,1,.4,1);
  max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 16px calc(18px + env(safe-area-inset-bottom));
}
.sheet.open{transform:translateY(0)}
@media(min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(560px,92vw);border-radius:var(--r-lg);
    transform:translate(-50%,-46%) scale(.97);opacity:0;transition:transform .2s ease,opacity .2s ease;max-height:86dvh}
  .sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1}
}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line-strong);margin:9px auto 4px}
.sheethead{position:sticky;top:0;background:var(--surface);padding:6px 50px 12px 0;z-index:2}
.sheethead h3{font-family:var(--font-display);font-size:18px;margin:0;letter-spacing:-.02em}
.sheethead p{margin:3px 0 0;font-size:13px;color:var(--ink-2)}
.closebtn{position:sticky;top:12px;z-index:4;width:32px;height:32px;margin-left:auto;margin-right:0;margin-bottom:-32px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;font-size:16px}

.pickgrid{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.pick{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;min-height:38px}
.pick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.sqpreview{
  display:flex;align-items:center;gap:12px;background:var(--surface-2);
  border-radius:var(--r-md);padding:11px 13px;margin-bottom:14px;
}
.sqpreview .box{width:46px;height:46px;border-radius:var(--r-sm);border:2px solid var(--line-strong);display:grid;place-items:center;font-family:var(--font-mono);font-size:13px;font-weight:600;flex:none;background:var(--surface)}
.sqpreview .meta{font-size:13px;color:var(--ink-2);line-height:1.4}
.sqpreview .meta b{display:block;color:var(--ink);font-size:14.5px;font-family:var(--font-display);letter-spacing:-.01em}

.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,140%);
  z-index:90;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:999px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow);transition:transform .28s cubic-bezier(.3,1,.4,1);
  max-width:min(90vw,420px);text-align:center;
}
.toast.show{transform:translate(-50%,0)}
.toast.bad{background:var(--danger);color:#FFF8F6}

.reqrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.reqrow:last-child{border-bottom:none}
.reqrow .info{flex:1;min-width:0}
.reqrow .info b{display:block;font-size:14px}

  var c = String(hex||"").replace("#","");

}

/* PIN hashing: protects against casual source viewing; Firebase rules remain prototype rules. */
function fallbackHash(text){
  var h=2166136261;

  return (h>>>0).toString(16);

    return Array.prototype.map.call(new Uint8Array(buf),function(x){return x.toString(16).padStart(2,"0");}).join("");
  });
}

  if (b.pinHash && b.pinSalt) return hashPin(pin,b.pinSalt).then(function(h){ return h===b.pinHash; });

}

/* ---------------- bindings ---------------- */
function bindBoard(){
  var grid=el("grid");if(!grid)return;
  grid.addEventListener("click",function(e){var cell=e.target.closest("[data-cell]");if(cell)return openClaim(cell.getAttribute("data-cell"));var ax=e.target.closest("[data-axis]");if(ax){if(state.board.digits.x)return;if(state.isAdmin)openAdmin("numbers");else toast(state.board.status==="open"?"Numbers stay hidden until the board locks.":"The organizer is ready to draw the numbers.");}});
  var z=el("zoomBtn");if(z)z.onclick=function(){state.zoom=!state.zoom;el("boardscroll").classList.toggle("zoomed",state.zoom);z.textContent=state.zoom?"Fit":"Bigger";z.classList.toggle("on",state.zoom);};
  var sb=el("scoreBtn");if(sb)sb.onclick=function(){openAdmin("scores");};
}
function bindGlobal(){
  var cb=el("createBoard");if(cb)cb.onclick=function(){createBoardFlow();};
  var jg=el("joinGo");if(jg)jg.onclick=function(){var code=(el("joinCode").value||"").trim().toLowerCase();if(!code)return toast("Type the board code first",true);loadBoard(code);};
  Array.prototype.forEach.call(document.querySelectorAll("[data-open]"),function(btn){btn.onclick=function(){loadBoard(btn.getAttribute("data-open"));};});
  Array.prototype.forEach.call(document.querySelectorAll("[data-approve]"),function(btn){btn.onclick=function(){setStatus(btn.getAttribute("data-approve"),"claimed");};});
  Array.prototype.forEach.call(document.querySelectorAll("[data-decline]"),function(btn){btn.onclick=function(){removeSquare(btn.getAttribute("data-decline"));};});
}
function createBoardFlow(){
  var t=appTrial();if(now()>=t.end)return toast("The 30-day trial has ended on this device.",true);
  var b=newBoard(),pin=String(Math.floor(100000+Math.random()*900000));
  setBoardPin(b,pin).then(function(){state.boardId=b.id;return saveNewBoard(b);}).then(function(){state.isAdmin=true;var p=prefs(),admins=p.admins||{};admins[b.id]=true;savePrefs({admins:admins,lastBoard:b.id});setHash(b.id);render();openSheet('<div class="sheethead"><h3>Board created</h3><p>Save this organizer PIN now.</p></div><div class="sqpreview"><div class="box" style="width:82px">'+pin+'</div><div class="meta"><b>Organizer PIN</b>This PIN is shown once. Players do not need it.</div></div><button class="btn primary full" id="createdGo">Set up the board</button>',function(){el("createdGo").onclick=function(){openAdmin("setup");};});}).catch(function(e){toast(e.message,true);});
}
function openClaim(k){

}

function bindPicker(side){var sel=el("a_"+side+"pick");if(!sel||sel.disabled)return;sel.onchange=function(){var v=sel.value,prev=el("a_"+side+"prev");if(v===""){el("a_"+side+"logo").value="";if(prev)prev.remove();return;}var t=NFL[Number(v)],url=logoUrl(t[3]);el("a_"+side+"name").value=t[1];el("a_"+side+"short").value=t[0];el("a_"+side+"color").value=t[2];el("a_"+side+"logo").value=url;if(prev)prev.src=url;};}
function bindSetup(editable){
  bindPicker("y");bindPicker("x");
  if(editable&&el("a_save"))el("a_save").onclick=function(){var v={name:el("a_name").value.trim(),yn:el("a_yname").value.trim(),ys:el("a_yshort").value.trim(),yc:el("a_ycolor").value,ylogo:el("a_ylogo").value,xn:el("a_xname").value.trim(),xs:el("a_xshort").value.trim(),xc:el("a_xcolor").value,xlogo:el("a_xlogo").value,mode:el("a_mode").value,rules:el("a_rules").value,pin:el("a_pin").value.trim()};var prep=Promise.resolve(v);if(v.pin){v.pinSalt=state.board.pinSalt||uid(18);prep=hashPin(v.pin,v.pinSalt).then(function(h){v.pinHash=h;return v;});}prep.then(function(){return mutate(function(b){assertOpen(b);b.name=v.name||b.name;b.teamY.name=v.yn||b.teamY.name;b.teamY.short=(v.ys||b.teamY.short).toUpperCase();b.teamY.color=v.yc;b.teamY.logo=v.ylogo;b.teamX.name=v.xn||b.teamX.name;b.teamX.short=(v.xs||b.teamX.short).toUpperCase();b.teamX.color=v.xc;b.teamX.logo=v.xlogo;b.mode=v.mode;b.rules=v.rules;if(v.pinHash){b.pinSalt=v.pinSalt;b.pinHash=v.pinHash;delete b.pin;}appendAudit(b,"settings","");});}).then(function(){closeSheet();render();toast("Board saved");}).catch(function(e){toast(e.message,true);});};
  if(el("a_export"))el("a_export").onclick=function(){var data=JSON.stringify(state.board,null,2),blob=new Blob([data],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="slo-points-"+state.board.id+".json";a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);toast("Backup downloaded");};
  if(el("a_import"))el("a_import").onclick=function(){el("a_file").click();};
  if(el("a_file"))el("a_file").onchange=function(e){var f=e.target.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){try{var b=migrate(JSON.parse(fr.result));if(!b||!b.id||!b.squares)throw new Error("bad");state.boardId=b.id;saveNewBoard(b).then(function(){setHash(b.id);closeSheet();render();toast("Board restored");}).catch(function(x){toast(x.message,true);});}catch(err){toast("That is not a SLO Points backup.",true);}};fr.readAsText(f);};
  if(el("a_new"))el("a_new").onclick=function(){if(confirm("Create a new points board? The current board stays saved.")){closeSheet();createBoardFlow();}};
  if(editable&&el("a_clear"))el("a_clear").onclick=function(){if(!confirm("Clear every square?"))return;mutate(function(b){assertOpen(b);b.squares={};appendAudit(b,"clear","");}).then(function(){closeSheet();render();toast("Board cleared");}).catch(function(e){toast(e.message,true);});};
}
function bindLayout(editable){Array.prototype.forEach.call(document.querySelectorAll("[data-grid]"),function(btn){btn.onclick=function(){if(!editable||reservedCount(state.board))return toast("Grid size freezes after the first claim.",true);var p=btn.getAttribute("data-grid").split("x");mutate(function(b){assertOpen(b);if(reservedCount(b))throw new Error("Grid size freezes after the first claim.");b.cols=Number(p[0]);b.rows=Number(p[1]);b.allowedCells=allowedCellsFor(b.cols,b.rows);b.digits={x:null,y:null,drawnAt:null};appendAudit(b,"resize",p.join("x"));}).then(function(){closeSheet();render();toast("Grid updated");}).catch(function(e){toast(e.message,true);});};});if(el("l_swap"))el("l_swap").onclick=function(){if(!editable||reservedCount(state.board))return toast("Team placement freezes after the first claim.",true);if(!confirm("Swap which team appears on the rows and columns?"))return;mutate(function(b){assertOpen(b);if(reservedCount(b))throw new Error("Team placement freezes after the first claim.");var t=b.teamX;b.teamX=b.teamY;b.teamY=t;appendAudit(b,"swap","");}).then(function(){closeSheet();render();toast("Teams swapped");}).catch(function(e){toast(e.message,true);});};}
function bindRewards(editable){if(editable&&el("r_save"))el("r_save").onclick=function(){var vals=Array.prototype.map.call(document.querySelectorAll("[data-r]"),function(inp){return{i:Number(inp.getAttribute("data-r")),f:inp.getAttribute("data-f"),v:inp.value};});mutate(function(b){assertOpen(b);vals.forEach(function(x){if(!b.rewards[x.i])return;if(x.f==="label")b.rewards[x.i].label=x.v.trim()||b.rewards[x.i].label;else b.rewards[x.i][x.f]=Math.max(0,Number(x.v)||0);});appendAudit(b,"rewards","");}).then(function(){closeSheet();render();toast("Point values saved");}).catch(function(e){toast(e.message,true);});};}
function bindNumbers(){if(el("n_lock"))el("n_lock").onclick=lockBoard;if(el("n_draw"))el("n_draw").onclick=runDraw;if(el("n_unlock"))el("n_unlock").onclick=unlockBoard;if(el("n_reset"))el("n_reset").onclick=resetDraw;}
function bindScores(){if(el("s_save"))el("s_save").onclick=function(){var vals=Array.prototype.map.call(document.querySelectorAll("[data-s]"),function(inp){return{k:inp.getAttribute("data-s"),t:inp.getAttribute("data-t"),v:inp.value};});mutate(function(b){assertTrial(b);if(!b.digits.x)throw new Error("Draw numbers first.");vals.forEach(function(x){if(!b.scores[x.k])b.scores[x.k]={x:null,y:null};b.scores[x.k][x.t]=x.v===""?null:Math.max(0,Number(x.v)||0);});if(b.scores.final.x!=null&&b.scores.final.y!=null)b.status="finished";else if(b.status==="finished")b.status="drawn";appendAudit(b,"scores","");}).then(function(){closeSheet();render();toast("Scores saved");}).catch(function(e){toast(e.message,true);});};}
function bindFirebase(){
  function copy(){var t=el("fb_rules");t.select();if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(function(){toast("Secure rules copied");});}
  function values(){return {url:el("fb_url").value.trim().replace(/\/+$/,""),key:el("fb_key").value.trim()};}
  if(el("fb_copy"))el("fb_copy").onclick=copy;
  if(el("fb_test"))el("fb_test").onclick=function(){
    var v=values();if(!v.url||!v.key)return toast("Enter the Database URL and Web API Key first",true);
    var btn=el("fb_test"),old={url:FB.url,key:FB.key},oldAuth=FBAUTH;btn.disabled=true;btn.textContent="Checking";FB={url:v.url,key:v.key};FBAUTH=null;
    ensureFirebaseAuth().then(function(){return firebaseFetch(fbPath("boards","__connection_test__"));}).then(function(r){
      if(r.ok)return toast("Anonymous auth and database reads are working");
      if(r.status===401||r.status===403)throw new Error("Authentication worked, but Database Rules blocked the read. Paste the rules below.");
      throw new Error("Firebase returned "+r.status+".");
    }).catch(function(e){toast(e.message,true);}).finally(function(){FB=old;FBAUTH=oldAuth;btn.disabled=false;btn.textContent="Test auth & rules";});
  };
  if(el("fb_save"))el("fb_save").onclick=function(){
    var v=values();if(!v.url||!v.key)return toast("Enter the Database URL and Web API Key first",true);
    var local=state.board,oldMode=Store.mode,old={url:FB.url,key:FB.key},oldAuth=FBAUTH,oldOwner=local.ownerUid,btn=el("fb_save");
    btn.disabled=true;btn.textContent="Authenticating";FB={url:v.url,key:v.key};FBAUTH=null;authPromise=null;Store.mode="firebase";etags={};
    ensureFirebaseAuth().then(function(a){local.ownerUid=a.uid;btn.textContent="Uploading";return saveNewBoard(local);}).then(function(check){
      var p=prefs(),admins=p.admins||{};admins[check.id]=true;savePrefs({fb:{url:v.url,key:v.key},lastBoard:check.id,admins:admins});state.isAdmin=true;state.syncErr="";setHash(check.id);closeSheet();render();toast("Firebase connected, secured, and upload verified");
    }).catch(function(e){local.ownerUid=oldOwner;FB=old;FBAUTH=oldAuth;Store.mode=oldMode;etags={};toast(e.message,true);btn.disabled=false;btn.textContent="Connect & upload";});
  };
  if(el("fb_clear"))el("fb_clear").onclick=function(){
    if(!confirm("Disconnect Firebase on this device? The remote board is not deleted."))return;
    var copyBoard=state.board;savePrefs({fb:null});FB={url:"",key:""};FBAUTH=null;authPromise=null;etags={};Store.mode=Store.localOk()?"local":"memory";
    Store.set(copyBoard.id,copyBoard).then(function(){setHash(copyBoard.id);closeSheet();render();toast("Firebase disconnected; a local copy was saved");});
  };
}

/* ---------------- sharing/theme/boot ---------------- */
function doShare(){
  if(!state.board)return toast("Create a board first",true);var url=shareUrl(state.board.id);
  if(!url)return openSheet('<div class="sheethead"><h3>Connect Firebase first</h3><p>A local file cannot keep multiple phones synchronized.</p></div><div class="note">Open Organizer → Firebase, connect your Realtime Database, and verify the upload. Then Share will create the live board link.</div>');
  var text=state.board.name+", "+state.board.teamY.short+" vs "+state.board.teamX.short+". Free points squares — no money. "+(totalSquares(state.board)-reservedCount(state.board))+" open.";
  if(navigator.share){navigator.share({title:"SLO Points Squares",text:text,url:url}).catch(function(){});return;}
  if(navigator.clipboard)navigator.clipboard.writeText(text+" "+url).then(function(){toast("Live link copied");}).catch(function(){prompt("Copy this link",url);});else prompt("Copy this link",url);
}
function applyTheme(){document.documentElement.setAttribute("data-theme",state.theme);var map={auto:["◐","Auto"],light:["☀","Day"],dark:["☾","Night"]},m=map[state.theme]||map.auto;el("themeIcon").textContent=m[0];el("themeWord").textContent=m[1];el("themeBtn").classList.toggle("on",state.theme!=="auto");}
function loadBoard(id){
  state.boardId=id;state.board=null;state.isAdmin=false;render();
  return Store.get(id).then(function(b){if(!b){toast("No board found for code "+id,true);state.boardId=null;render();return;}state.board=b;touchIndex(b);savePrefs({lastBoard:id});var admins=prefs().admins||{};state.isAdmin=!!admins[id]&&isFirebaseOwner(b);setHash(id);render();}).catch(function(e){toast(e.message,true);state.boardId=null;render();});
}
function boot(){
  var p=prefs(),sm=location.hash.match(/[#&]s=([A-Za-z0-9\-_]+)/),cfg=sm?decodeSync(sm[1]):null;
  if(cfg){FB={url:cfg.url,key:cfg.key};savePrefs({fb:FB});}else if(p.fb&&p.fb.url&&p.fb.key)FB=p.fb;
  state.deviceId=p.deviceId||uid(12);if(!p.deviceId)savePrefs({deviceId:state.deviceId});state.me=p.me||"";state.theme=p.theme||"auto";applyTheme();appTrial();
  try{state.index=JSON.parse(localStorage.getItem(IDX))||[];}catch(e){state.index=[];}
  Store.init().then(function(){var m=location.hash.match(/b=([a-z0-9]+)/i),id=m?m[1]:(p.lastBoard||null);if(!id){render();return;}return loadBoard(id);}).catch(function(){render();toast("Storage did not start. Changes will not save.",true);});
  setInterval(function(){if(!document.hidden&&!sheetOpen)pull();},3500);window.addEventListener("focus",pull);document.addEventListener("visibilitychange",function(){if(!document.hidden)pull();});window.addEventListener("hashchange",function(){var m=location.hash.match(/b=([a-z0-9]+)/i);if(m&&m[1]!==state.boardId)loadBoard(m[1]);});
}

el("scrim").onclick=closeSheet;document.addEventListener("keydown",function(e){if(e.key==="Escape"&&sheetOpen)closeSheet();});

el("shareBtn").onclick=doShare;
el("adminBtn").onclick=function(){if(!state.board)return toast("Create a board first",true);if(state.isAdmin)openAdmin("setup");else openPin(function(){openAdmin("setup");});};

boot();
})();
