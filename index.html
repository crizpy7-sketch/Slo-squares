<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SLO Squares</title>
<meta name="description" content="Run a football squares pool. One admin sets the teams, payouts and rules. Players claim squares and they lock instantly.">
<meta name="theme-color" content="#EFEDE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SLO Squares">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --font-display:'Archivo Black','Arial Black','Helvetica Neue',sans-serif;
  --font-body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;

  --r-sm:4px; --r-md:10px; --r-lg:18px;

  --bg:#EFEDE6;
  --surface:#F8F7F3;
  --surface-2:#E7E4DA;
  --line:#D2CFC4;
  --line-strong:#B4AF9F;
  --ink:#1A1F1D;
  --ink-2:#5F6863;
  --ink-3:#8A928C;
  --accent:#E9A900;
  --accent-ink:#221900;
  --accent-text:#7E5A00;
  --accent-soft:#F7E8BC;
  --danger:#C43B24;
  --danger-soft:#F6DCD6;
  --ok:#2F7D5B;
  --shadow:0 1px 2px rgba(26,31,29,.08),0 8px 24px rgba(26,31,29,.06);
  --sheet-shadow:0 -8px 40px rgba(26,31,29,.18);
  --cell:clamp(24px,7.2vw,54px);

  --tx:#97233F; --tx-ink:#FFF9F0;
  --ty:#0085CA; --ty-ink:#FFF9F0;
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --bg:#101614;
    --surface:#18211F;
    --surface-2:#212D2A;
    --line:#2D3D39;
    --line-strong:#435A54;
    --ink:#E9EFEC;
    --ink-2:#A2B2AC;
    --ink-3:#76867F;
    --accent:#F2B705;
    --accent-ink:#0F1412;
    --accent-text:#F2B705;
    --accent-soft:#2E2A12;
    --danger:#F06A50;
    --danger-soft:#3A1E17;
    --ok:#5CC391;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.4);
    --sheet-shadow:0 -8px 40px rgba(0,0,0,.6);
  }
}
html[data-theme="dark"]{
  --bg:#101614;
  --surface:#18211F;
  --surface-2:#212D2A;
  --line:#2D3D39;
  --line-strong:#435A54;
  --ink:#E9EFEC;
  --ink-2:#A2B2AC;
  --ink-3:#76867F;
  --accent:#F2B705;
  --accent-ink:#0F1412;
  --accent-text:#F2B705;
  --accent-soft:#2E2A12;
  --danger:#F06A50;
  --danger-soft:#3A1E17;
  --ok:#5CC391;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.4);
  --sheet-shadow:0 -8px 40px rgba(0,0,0,.6);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100dvh;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}

.wrap{max-width:760px;margin:0 auto;padding:0 14px 120px}

/* Header */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--bg);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(150%) blur(12px);
  border-bottom:none;
  padding-top:env(safe-area-inset-top);
}
.topbar::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--ty) 0%,var(--ty) 46%,var(--accent) 50%,var(--tx) 54%,var(--tx) 100%);
}
.topbar-in{max-width:760px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--font-display);font-size:15px;letter-spacing:-.02em;text-transform:uppercase}
.brand .sq{
  width:26px;height:26px;border-radius:var(--r-sm);
  background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-size:9.5px;letter-spacing:0;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);
}
.spacer{flex:1}
.iconbtn{
  min-height:34px;padding:0 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:5px;
}
.iconbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.iconbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Matchup strip */
.matchup{display:flex;align-items:stretch;gap:8px;margin:14px 0 10px}
.team{
  flex:1;min-width:0;background:var(--tc);color:var(--tci);
  border:none;border-radius:var(--r-md);padding:10px 11px;position:relative;overflow:hidden;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.22), var(--shadow);
  display:flex;align-items:center;gap:9px;
}
.tmeta{min-width:0;flex:1}
.tlogo{width:34px;height:34px;object-fit:contain;flex:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.picklogo{width:26px;height:26px;object-fit:contain;vertical-align:-7px;margin-right:7px}
.iconbtn.theme{gap:6px;font-size:12px}
.iconbtn.theme span:first-child{font-size:13px;line-height:1}
@media (max-width:379px){ .brand .word{display:none} }
.team .axis{font-family:var(--font-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;opacity:.72}
.team .nm{font-family:var(--font-display);font-size:16px;line-height:1.15;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.team .sc{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--font-display);font-size:26px;opacity:.28;letter-spacing:-.04em}
.vs{align-self:center;font-family:var(--font-display);font-size:12px;color:var(--ink-3);letter-spacing:.02em}

/* Sold bar */
.progress{position:relative;height:26px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-bottom:11px;border:1px solid var(--line)}
.progress .bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--ty),var(--tx));transition:width .5s cubic-bezier(.3,1,.4,1)}
.progress .lb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font-mono);font-size:11.5px;font-weight:600;color:var(--ink);mix-blend-mode:normal}
.progress .lb b{font-family:var(--font-display);font-size:13px}

/* Info row */
.inforow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{
  font-family:var(--font-mono);font-size:11.5px;font-weight:500;
  border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;color:var(--ink-2);
}
.chip b{color:var(--ink);font-weight:600}
.chip.live{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.chip.warn{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.chip.pot{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}

/* Board */
.boardcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 12px 14px;box-shadow:var(--shadow)}
.boardhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.boardhead h2{font-family:var(--font-display);font-size:13px;letter-spacing:.02em;text-transform:uppercase;margin:0}
.boardscroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;margin:0 -2px;padding:0 2px}
.grid{
  display:grid;
  gap:3px;
  width:100%;
  margin:0 auto;
  transition:opacity .18s ease;
}
.grid.settling{opacity:0}
.boardscroll.zoomed .grid{width:auto;min-width:var(--zoomw,100%)}
.grid.c10 .sq{font-size:clamp(8px,2.6vw,15px)}
.grid.c10 .gcell.axis{font-size:clamp(11px,3.4vw,20px)}
.grid.c10 .gcell.axis.multi{font-size:clamp(8px,2.4vw,14px)}
.grid.c5 .sq{font-size:clamp(13px,5vw,30px)}
.grid.c5 .gcell.axis{font-size:clamp(16px,6vw,34px)}
.grid.c5 .gcell.axis.multi{font-size:clamp(12px,4.2vw,24px)}
.gcell{
  aspect-ratio:1;border-radius:clamp(4px,1.1vw,9px);position:relative;min-width:0;
  display:grid;place-items:center;font-family:var(--font-mono);
  background:var(--surface-2);border:1px solid transparent;color:var(--ink-3);
  transition:transform .16s cubic-bezier(.3,1,.4,1), background .22s ease, box-shadow .22s ease, color .22s ease;
}
.gcell.corner{background:transparent}
.gcell.axis{
  background:transparent;font-weight:700;
  border:2px dashed var(--ax,var(--line));
  color:var(--ax,var(--ink-3));
}
.gcell.axis.set{
  border:none;background:var(--ax);color:var(--axi);
  font-family:var(--font-display);letter-spacing:-.03em;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.24);
}
.gcell.axis.multi{letter-spacing:-.06em}
.gcell.axis.set.multi{word-spacing:-1px}
.gcell.axis.rolling{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);border-style:solid}
.gcell.axis.pop{animation:pop .34s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.14)}100%{transform:scale(1)}}

.sq{
  background:var(--surface);border:1px solid var(--line);
  color:var(--ink-3);overflow:hidden;
}
.sq:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.sq.taken{
  background:var(--pc);border-color:transparent;
  color:var(--pi);font-weight:700;
  font-family:var(--font-display);font-size:clamp(7.5px,2.2vw,11px);
  letter-spacing:-.03em;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.26);
}
.sq.pending{
  background:repeating-linear-gradient(135deg,var(--pc),var(--pc) 4px,rgba(0,0,0,.22) 4px,rgba(0,0,0,.22) 8px);
  border:2px dashed var(--surface);color:var(--pi);font-weight:700;
}
.sq.unpaid{box-shadow:inset 0 0 0 3px var(--surface), inset 0 -3px 0 rgba(0,0,0,.26)}
.sq.mine{outline:2px solid var(--ink);outline-offset:-3px}
.sq.win{
  border-color:transparent;z-index:3;
  box-shadow:0 0 0 3px var(--accent), inset 0 -3px 0 rgba(0,0,0,.26);
  animation:winpulse 1.9s ease-in-out infinite;
}
.sq.fresh{animation:landed .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes winpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes landed{0%{transform:scale(.4) rotate(-14deg);opacity:.2}70%{transform:scale(1.16) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
.sq .tag{
  position:absolute;top:-1px;right:-1px;background:var(--accent);color:var(--accent-ink);
  font-family:var(--font-mono);font-size:8px;font-weight:600;line-height:1;
  padding:2px 3px;border-radius:0 var(--r-sm) 0 var(--r-sm);
}
.sq .tag.rev{background:var(--ink);color:var(--surface)}
.sq:active{transform:scale(.94)}
.axislabel{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);display:flex;align-items:center;gap:6px;
}
.axislabel .dashline{flex:1;height:1px;background:var(--line)}
.rowlabel{writing-mode:vertical-rl;transform:rotate(180deg)}

/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:3px 9px 3px 4px}
.lg .sw{width:16px;height:16px;border-radius:var(--r-sm);background:var(--c);flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.24)}
.lg b{color:var(--ink);font-weight:600;font-family:var(--font-mono);font-size:11px}

/* Sections */
section{margin-top:18px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 9px}
.sechead h2{font-family:var(--font-display);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;margin:0;color:var(--ink);display:flex;align-items:center;gap:7px}
.sechead h2::before{content:"";width:9px;height:16px;border-radius:2px;background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px;box-shadow:var(--shadow)}
.card + .card{margin-top:9px}

/* Payout rows */
.prow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none;padding-bottom:0}
.prow:first-child{padding-top:0}
.prow .lbl{font-weight:600;font-size:14px}
.prow .amt{font-family:var(--font-mono);font-size:15px;font-weight:600;text-align:right;white-space:nowrap}
.scorepills{display:flex;gap:5px;align-items:center}
.pill{
  font-family:var(--font-display);font-size:15px;letter-spacing:-.02em;
  padding:3px 10px;border-radius:var(--r-sm);background:var(--c);color:var(--ci);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.24);min-width:44px;text-align:center;
}
.pill.blank{background:var(--surface-2);color:var(--ink-3);box-shadow:none;font-family:var(--font-mono);font-size:11px}
.prow .sub{grid-column:1/-1;font-size:12.5px;color:var(--ink-2);margin-top:-2px}
.prow .sub b{color:var(--ink);font-weight:600}
.prow.hit{background:var(--accent-soft);margin:0 -13px;padding:9px 13px;border-radius:var(--r-md);border-bottom-color:transparent}
.prow.hit .lbl{color:var(--accent-text)}

/* Roster */
.rrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:none}
.rrow .dot{
  width:30px;height:24px;border-radius:var(--r-sm);background:var(--pc);color:var(--pi);flex:none;
  display:grid;place-items:center;font-family:var(--font-display);font-size:9.5px;letter-spacing:-.02em;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.24);
}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
#confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:1px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(104vh) rotate(760deg);opacity:.15}}
.rrow .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .ct{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2)}
.rrow .owe{font-family:var(--font-mono);font-size:13px;font-weight:600;min-width:62px;text-align:right}
.rrow .owe.clear{color:var(--ok)}

.empty{text-align:left;padding:22px 4px;color:var(--ink-2);font-size:14px}
.empty strong{display:block;font-family:var(--font-display);font-size:16px;color:var(--ink);margin-bottom:5px;letter-spacing:-.01em}

/* Buttons */
.btn{
  min-height:44px;padding:0 16px;border-radius:var(--r-md);font-weight:600;font-size:14.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:inset 0 -3px 0 rgba(0,0,0,.24)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.full{width:100%}
.btn.sm{min-height:34px;font-size:13px;padding:0 11px;border-radius:var(--r-sm)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1;min-width:120px}

/* Fields */
.field{margin-bottom:11px}
.field label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;min-height:44px;padding:10px 12px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--bg);color:var(--ink);
}
.field textarea{min-height:88px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.field .hint{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.4}
.field.err input{border-color:var(--danger)}
.field .errmsg{font-size:12.5px;color:var(--danger);margin-top:5px;display:none}
.field.err .errmsg{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input[type="color"]{padding:3px;height:44px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,13,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;
  box-shadow:var(--sheet-shadow);border-top:1px solid var(--line);
  transform:translateY(102%);transition:transform .26s cubic-bezier(.3,1,.4,1);
  max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 16px calc(18px + env(safe-area-inset-bottom));
}
.sheet.open{transform:translateY(0)}
@media(min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(560px,92vw);border-radius:var(--r-lg);
    transform:translate(-50%,-46%) scale(.97);opacity:0;transition:transform .2s ease,opacity .2s ease;max-height:86dvh}
  .sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1}
}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line-strong);margin:9px auto 4px}
.sheethead{position:sticky;top:0;background:var(--surface);padding:6px 0 12px;z-index:2}
.sheethead h3{font-family:var(--font-display);font-size:18px;margin:0;letter-spacing:-.02em}
.sheethead p{margin:3px 0 0;font-size:13px;color:var(--ink-2)}
.closebtn{position:absolute;top:12px;right:14px;width:32px;height:32px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;font-size:16px}

.pickgrid{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.pick{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;min-height:38px}
.pick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.sqpreview{
  display:flex;align-items:center;gap:12px;background:var(--surface-2);
  border-radius:var(--r-md);padding:11px 13px;margin-bottom:14px;
}
.sqpreview .box{width:46px;height:46px;border-radius:var(--r-sm);border:2px solid var(--line-strong);display:grid;place-items:center;font-family:var(--font-mono);font-size:13px;font-weight:600;flex:none;background:var(--surface)}
.sqpreview .meta{font-size:13px;color:var(--ink-2);line-height:1.4}
.sqpreview .meta b{display:block;color:var(--ink);font-size:14.5px;font-family:var(--font-display);letter-spacing:-.01em}

.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,140%);
  z-index:90;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:999px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow);transition:transform .28s cubic-bezier(.3,1,.4,1);
  max-width:min(90vw,420px);text-align:center;
}
.toast.show{transform:translate(-50%,0)}
.toast.bad{background:var(--danger);color:#FFF8F6}

.reqrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.reqrow:last-child{border-bottom:none}
.reqrow .info{flex:1;min-width:0}
.reqrow .info b{display:block;font-size:14px}

<script>
(function(){
"use strict";

/* ---------------- constants ---------------- */
var KEY = "slosq.v1";
var bKey = function(id){ return KEY + ".board." + id; };
var IDX  = KEY + ".index";
var PREF = KEY + ".prefs";

var PALETTE = ["#CC3825","#F07A13","#EBA800","#7FA300","#17994F","#009488","#09779E","#2C63D8","#5B4BC4","#8A3FBF","#C42E86","#B5203C"];
var NFL = [
  ["ARI","Arizona Cardinals","#97233F","500/ari.png"],
  ["ATL","Atlanta Falcons","#A71930","500/atl.png"],
  ["BAL","Baltimore Ravens","#241773","500/bal.png"],

  ["DEN","Denver Broncos","#002244","500/den.png"],
  ["DET","Detroit Lions","#0076B6","500/det.png"],

  ["HOU","Houston Texans","#03202F","500/hou.png"],

  ["KC","Kansas City Chiefs","#E31837","500/kc.png"],
  ["LV","Las Vegas Raiders","#15171C","500/lv.png"],
  ["LAC","Los Angeles Chargers","#007BC7","500/lac.png"],
  ["LAR","Los Angeles Rams","#003594","500/lar.png"],
  ["MIA","Miami Dolphins","#008E97","500/mia.png"],
  ["MIN","Minnesota Vikings","#4F2683","500/min.png"],
  ["NE","New England Patriots","#002244","500/ne.png"],
  ["NO","New Orleans Saints","#D3BC8D","500/no.png"],
  ["NYG","New York Giants","#0B2265","500/nyg.png"],
  ["NYJ","New York Jets","#003F2D","500/nyj.png"],
  ["PHI","Philadelphia Eagles","#004C54","500/phi.png"],
  ["PIT","Pittsburgh Steelers","#15171C","500/pit.png"],
  ["SF","San Francisco 49ers","#AA0000","500/sf.png"],

  ["TB","Tampa Bay Buccaneers","#A71930","500/tb.png"],
  ["TEN","Tennessee Titans","#4495D2","500/ten.png"],

];
function logoUrl(suffix){ return suffix ? "https://a.espncdn.com/i/teamlogos/nfl/" + suffix : ""; }
function logoImg(t, cls){
  if (!t || !t.logo) return "";
  return '<img class="' + cls + '" src="' + esc(t.logo) + '" alt="" loading="lazy" onerror="this.remove()">';
}
var PERIODS = [
  { key:"q1",    label:"1st Quarter" },
  { key:"q2",    label:"Halftime" },
  { key:"q3",    label:"3rd Quarter" },
  { key:"final", label:"Final Score" }
];

/* ---------------- storage adapter ---------------- */
var mem = {};
var SB = { url:"", key:"" };
var FB = { url:"" };
var etags = {};
function fbConfigured(){ return !!FB.url; }
function fbPath(id){ return FB.url + "/boards/" + encodeURIComponent(id) + ".json"; }
function sbHeaders(extra){
  var h = { "apikey": SB.key, "Authorization": "Bearer " + SB.key, "Content-Type": "application/json" };
  if (extra) for (var k in extra) h[k] = extra[k];
  return h;
}
function boardIdFromKey(key){ return key.split(".board.")[1] || key; }
function sbConfigured(){ return !!(SB.url && SB.key); }
function b64url(str){
  try { return btoa(str).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); } catch(e){ return ""; }
}
function encodeSync(){
  if (fbConfigured()) return b64url("fb\n" + FB.url);
  if (sbConfigured()) return b64url("sb\n" + SB.url + "\n" + SB.key);
  return "";
}
function decodeSync(t){
  try {
    var raw = atob(t.replace(/-/g,"+").replace(/_/g,"/"));
    var parts = raw.split("\n");
    if (parts[0] === "fb" && parts[1]) return { kind:"fb", url:parts[1] };
    if (parts[0] === "sb" && parts[1] && parts[2]) return { kind:"sb", url:parts[1], key:parts[2] };
    var i = raw.indexOf("|");   // links made before providers existed
    if (i > 0) return { kind:"sb", url: raw.slice(0,i), key: raw.slice(i+1) };
    return null;
  } catch(e){ return null; }
}
var Store = {
  mode:"local",
  ready:false,
  init:function(){
    var self = this;
    if (fbConfigured()){
      self.mode = "firebase"; self.ready = true;
      return Promise.resolve();
    }
    if (sbConfigured()){
      self.mode = "supabase"; self.ready = true;
      return Promise.resolve();
    }
    if (window.storage && typeof window.storage.list === "function"){
      return window.storage.list(KEY + ".", true).then(function(){
        self.mode = "cloud"; self.ready = true;
      }).catch(function(){
        self.mode = self.localOk() ? "local" : "memory"; self.ready = true;
      });
    }
    self.mode = self.localOk() ? "local" : "memory";
    self.ready = true;
    return Promise.resolve();
  },
  localOk:function(){
    try { localStorage.setItem(KEY + ".probe","1"); localStorage.removeItem(KEY + ".probe"); return true; }
    catch(e){ return false; }
  },
  get:function(key){
    if (this.mode === "firebase"){
      var fid = boardIdFromKey(key);
      return fetch(fbPath(fid), { headers: { "X-Firebase-ETag": "true" } })
        .then(function(r){
          if (!r.ok) throw new Error(r.status === 401 ? "Firebase rules refused the read." : "Firebase said " + r.status);
          var tag = r.headers.get("ETag");
          if (tag) etags[fid] = tag;
          return r.json();
        })
        .then(function(v){ return v ? migrate(v) : null; })
        .catch(function(e){ state.syncErr = "Sync is down. " + e.message; return null; });
    }
    if (this.mode === "supabase"){
      var id = boardIdFromKey(key);
      return fetch(SB.url + "/rest/v1/slo_boards?id=eq." + encodeURIComponent(id) + "&select=data", { headers: sbHeaders() })
        .then(function(r){
          if (!r.ok) throw new Error("Supabase said " + r.status);
          return r.json();
        })
        .then(function(rows){ return rows && rows[0] ? migrate(rows[0].data) : null; })
        .catch(function(e){ state.syncErr = "Sync is down. " + e.message; return null; });
    }
    if (this.mode === "cloud"){
      return window.storage.get(key, true).then(function(r){
        return r && r.value ? migrate(JSON.parse(r.value)) : null;
      }).catch(function(){ return null; });
    }
    return new Promise(function(res){
      try {
        var raw = Store.mode === "memory" ? mem[key] : localStorage.getItem(key);
        res(raw ? migrate(JSON.parse(raw)) : null);
      } catch(e){ res(null); }
    });
  },
  set:function(key, val){
    var s = JSON.stringify(val);
    if (this.mode === "firebase"){
      var fid = boardIdFromKey(key);
      var h = { "Content-Type": "application/json", "X-Firebase-ETag": "true" };
      if (etags[fid]) h["if-match"] = etags[fid];
      return fetch(fbPath(fid), { method:"PUT", headers:h, body:s }).then(function(r){
        if (r.status === 412){
          /* the row moved under us. drop the stale tag so the retry re-reads. */
          delete etags[fid];
          var e = new Error("Another phone saved first.");
          e.conflict = true;
          throw e;
        }
        if (r.status === 401) throw new Error("Firebase rules refused the write. Check the rules from the Sync tab.");
        if (!r.ok) throw new Error("Firebase refused the write (" + r.status + ").");
        var tag = r.headers.get("ETag");
        if (tag) etags[fid] = tag; else delete etags[fid];
        return true;
      });
    }
    if (this.mode === "supabase"){
      var id = boardIdFromKey(key);
      return fetch(SB.url + "/rest/v1/slo_boards?on_conflict=id", {
        method: "POST",
        headers: sbHeaders({ "Prefer": "resolution=merge-duplicates,return=minimal" }),
        body: JSON.stringify({ id: id, data: val, rev: val.rev || 1, updated_at: new Date().toISOString() })
      }).then(function(r){
        if (!r.ok){
          return r.text().then(function(t){
            throw new Error(r.status === 404
              ? "The slo_boards table is missing. Run the setup SQL from the Sync tab."
              : "Save refused by Supabase (" + r.status + "). " + t.slice(0,120));
          });
        }
        return true;
      });
    }
    if (this.mode === "cloud"){
      return window.storage.set(key, s, true).then(function(r){
        if (!r) throw new Error("The board did not save. Check your connection and try again.");
        return true;
      });
    }
    return new Promise(function(res, rej){
      try {
        if (Store.mode === "memory") mem[key] = s; else localStorage.setItem(key, s);
        res(true);
      } catch(e){ rej(new Error("Storage is full or blocked on this device. The claim was not saved.")); }
    });
  }
};

/* ---------------- state ---------------- */
var state = {
  board:null,
  boardId:null,
  isAdmin:false,
  deviceId:null,
  me:"",
  index:[],
  lastSync:0,
  syncErr:"",
  writing:false,
  zoom:false,
  theme:"auto",
  showUnpaid:false
};

/* Boards saved before grid sizes existed have no cols/rows and store digits as
   a flat list of ten numbers. Bring them up to the grouped shape on read so an
   old board still opens. */
function migrate(b){
  if (!b || !b.squares || !b.teamX) return b;
  if (typeof b.cols !== "number") b.cols = 10;
  if (typeof b.rows !== "number") b.rows = 10;
  if (b.digits){
    ["x","y"].forEach(function(ax){
      var g = b.digits[ax];
      if (g && g.length && typeof g[0] === "number"){
        b.digits[ax] = g.map(function(d){ return [d]; });
      }
    });
  }
  return b;
}
var FB_RULES = "{\n  \"rules\": {\n    \"boards\": {\n      \"$board\": {\n        \".read\": true,\n        \".write\": true,\n        \".validate\": \"newData.hasChildren(['id','squares','teamX'])\"\n      }\n    }\n  }\n}";
var SB_SQL = "create table if not exists public.slo_boards (\n  id text primary key,\n  data jsonb not null,\n  rev integer not null default 1,\n  updated_at timestamptz not null default now()\n);\n\nalter table public.slo_boards enable row level security;\n\ncreate policy slo_read   on public.slo_boards for select to anon using (true);\ncreate policy slo_insert on public.slo_boards for insert to anon with check (true);\ncreate policy slo_update on public.slo_boards for update to anon using (true) with check (true);\n-- no delete policy on purpose, so a board cannot be wiped\n\nalter table public.slo_boards\n  add constraint slo_data_size check (pg_column_size(data) < 200000);";
var GRIDS = [
  { cols:10, rows:10, total:100, label:"100 squares", sub:"10 by 10, one number a side" },
  { cols:10, rows:5,  total:50,  label:"50 squares",  sub:"10 across, two numbers down the side" },
  { cols:5,  rows:5,  total:25,  label:"25 squares",  sub:"5 by 5, two numbers every side" }
];
function cols(b){ return (b && b.cols) || 10; }
function rows(b){ return (b && b.rows) || 10; }
function totalSquares(b){ return cols(b) * rows(b); }
function groupText(g){ return Array.isArray(g) ? g.join("") : String(g); }
function digitIndex(groups, d){
  for (var i=0;i<groups.length;i++){
    if (groups[i].indexOf(d) >= 0) return i;
  }
  return -1;
}
function uid(n){
  var s = "abcdefghijkmnpqrstuvwxyz23456789", o = "";
  for (var i=0;i<(n||6);i++) o += s[Math.floor(Math.random()*s.length)];
  return o;
}
function esc(t){
  return String(t == null ? "" : t).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function money(n){
  var v = Number(n) || 0;
  return (state.board && state.board.currency ? state.board.currency : "$") + v.toLocaleString();
}
/* Picks whichever of the two inks actually reads best on the colour, rather
   than guessing from a brightness threshold. Mid tone oranges and greens fail
   AA against white but clear it easily against near black. */
var INK_DARK = "#15180F", INK_LIGHT = "#FFF9F0";
function relLum(hex){
  var c = String(hex || "").replace("#","");
  if (c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  if (!/^[0-9a-f]{6}$/i.test(c)) return 0;
  function lin(h){ var v = parseInt(h,16)/255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); }
  return 0.2126*lin(c.substr(0,2)) + 0.7152*lin(c.substr(2,2)) + 0.0722*lin(c.substr(4,2));
}
function contrast(a, b){
  var l1 = relLum(a), l2 = relLum(b), hi = Math.max(l1,l2), lo = Math.min(l1,l2);
  return (hi + 0.05) / (lo + 0.05);
}
function inkOn(hex){
  return contrast(hex, INK_DARK) >= contrast(hex, INK_LIGHT) ? INK_DARK : INK_LIGHT;
}
function applyTeamColors(b){
  var r = document.documentElement.style;
  r.setProperty("--tx", b.teamX.color);
  r.setProperty("--tx-ink", inkOn(b.teamX.color));
  r.setProperty("--ty", b.teamY.color);
  r.setProperty("--ty-ink", inkOn(b.teamY.color));
}
function burst(color){
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var box = el("confetti");
  if (!box) return;
  for (var i=0;i<22;i++){
    var b = document.createElement("i");
    b.style.left = (4 + Math.random()*92) + "%";
    b.style.background = i % 4 === 0 ? color : PALETTE[Math.floor(Math.random()*PALETTE.length)];
    b.style.animationDuration = (0.9 + Math.random()*0.7) + "s";
    b.style.animationDelay = (Math.random()*0.22) + "s";
    b.style.transform = "rotate(" + Math.floor(Math.random()*180) + "deg)";
    box.appendChild(b);
  }
  setTimeout(function(){ box.innerHTML = ""; }, 2000);
}
function initials(name){
  var p = String(name||"").trim().split(/\s+/);
  if (!p[0]) return "??";
  if (p.length === 1) return p[0].slice(0,4).toUpperCase();
  return (p[0][0] + p[1][0] + (p[1][1]||"")).toUpperCase();
}
function setHash(id){
  try { history.replaceState(null, "", "#b=" + id); }
  catch(e){ try { location.hash = "b=" + id; } catch(e2){} }
}
function shareUrl(id){
  var o = location.origin, p = location.pathname;
  if (!o || o === "null" || o === "about:") return null;
  var t = sbConfigured() ? "&s=" + encodeSync() : "";
  return o + p + "#b=" + id + t;
}
function prefs(){
  try { return JSON.parse(localStorage.getItem(PREF)) || {}; } catch(e){ return {}; }
}
function savePrefs(o){
  try { localStorage.setItem(PREF, JSON.stringify(Object.assign(prefs(), o))); } catch(e){}
}

/* ---------------- board model ---------------- */
function newBoard(){
  return {
    id: uid(6),
    rev: 1,
    name: "Week 1 squares",
    teamX: { name:"Arizona Cardinals", short:"ARI", color:"#97233F", logo:logoUrl("500/ari.png") },
    teamY: { name:"Carolina Panthers", short:"CAR", color:"#0085CA", logo:logoUrl("500-dark/car.png") },
    price: 20,
    currency: "$",
    mode: "instant",
    cols: 10,
    rows: 10,
    maxPer: 0,
    rules: "No pay no play.\nSquares lock as soon as they are claimed.\nNumbers get drawn once the board is full.\nPayouts go out after the game ends.",
    payouts: [
      { key:"q1", label:"1st Quarter", amount:220, reverse:100 },
      { key:"q2", label:"Halftime", amount:220, reverse:100 },
      { key:"q3", label:"3rd Quarter", amount:220, reverse:100 },
      { key:"final", label:"Final Score", amount:720, reverse:300 }
    ],
    digits: { x:null, y:null, drawnAt:null },
    squares: {},
    scores: { q1:{x:null,y:null}, q2:{x:null,y:null}, q3:{x:null,y:null}, final:{x:null,y:null} },
    pin: "2810",
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
}
function playerInk(name){ return inkOn(playerColor(name)); }
function playerColor(name){
  var b = state.board; if (!b) return PALETTE[0];
  var names = [], k;
  for (k in b.squares){ if (names.indexOf(b.squares[k].name) < 0) names.push(b.squares[k].name); }
  names.sort();
  var i = names.indexOf(name);
  return PALETTE[(i < 0 ? 0 : i) % PALETTE.length];
}
function roster(){
  var b = state.board, map = {}, k, s;
  for (k in b.squares){
    s = b.squares[k];
    if (!map[s.name]) map[s.name] = { name:s.name, total:0, paid:0, pending:0, keys:[] };
    map[s.name].keys.push(k);
    if (s.status === "pending") map[s.name].pending++;
    else { map[s.name].total++; if (s.paid) map[s.name].paid++; }
  }
  return Object.keys(map).map(function(n){ return map[n]; })
    .sort(function(a,c){ return c.total - a.total || a.name.localeCompare(c.name); });
}
function countFor(name){
  var b = state.board, n = 0, k;
  for (k in b.squares){ if (b.squares[k].name.toLowerCase() === String(name).toLowerCase()) n++; }
  return n;
}
function soldCount(){
  var n = 0, k;
  for (k in state.board.squares){ if (state.board.squares[k].status !== "pending") n++; }
  return n;
}
function winners(periodKey){
  var b = state.board, d = b.digits, s = b.scores[periodKey];
  if (!d.x || !d.y || s.x == null || s.y == null) return null;
  var xi = digitIndex(d.x, s.x % 10), yi = digitIndex(d.y, s.y % 10);
  var rx = digitIndex(d.x, s.y % 10), ry = digitIndex(d.y, s.x % 10);
  return { straight: xi + "," + yi, reverse: rx + "," + ry };
}
function winMap(){
  var m = {};
  PERIODS.forEach(function(p){
    var w = winners(p.key);
    if (!w) return;
    if (!m[w.straight]) m[w.straight] = [];
    m[w.straight].push({ p:p, kind:"straight" });
    if (!m[w.reverse]) m[w.reverse] = [];
    m[w.reverse].push({ p:p, kind:"reverse" });
  });
  return m;
}
function payoutFor(key){
  var b = state.board;
  for (var i=0;i<b.payouts.length;i++){ if (b.payouts[i].key === key) return b.payouts[i]; }
  return { label:key, amount:0, reverse:0 };
}

/* ---------------- persistence ---------------- */
function saveBoard(b){
  b.rev = (b.rev || 0) + 1;
  b.updatedAt = Date.now();
  return Store.set(bKey(b.id), b).then(function(){
    state.board = b;
    state.syncErr = "";
    touchIndex(b);
    return b;
  });
}

/* Every change to a live board goes through here. Writes are queued one at a
   time on this device, applied on top of the freshest copy of the board, and
   read back to confirm they survived. Without this, two people saving in the
   same second wipe each other out. */
var writeQueue = Promise.resolve();
function mutate(apply, verify){
  function attempt(n){
    return Store.get(bKey(state.boardId)).then(function(fresh){
      var b = fresh || state.board;
      apply(b);
      b.rev = (b.rev || 0) + 1;
      b.updatedAt = Date.now();
      return Store.set(bKey(b.id), b).then(function(){
        return Store.get(bKey(b.id)).then(function(check){
          var f = check || b;
          if (verify && !verify(f)){
            if (n < 2) return attempt(n + 1);
            throw new Error("Another phone saved at the same moment. Give that another go.");
          }
          state.board = f;
          state.syncErr = "";
          touchIndex(f);
          return f;
        });
      });
    }).catch(function(err){
      /* only a lost race is worth retrying. "that square is taken" must stand. */
      if (err && err.conflict && n < 3) return attempt(n + 1);
      throw err;
    });
  }
  state.writing = true;
  var p = writeQueue.then(function(){ return attempt(0); }, function(){ return attempt(0); });
  writeQueue = p.then(function(){}, function(){});
  return p.finally(function(){ state.writing = false; });
}
function touchIndex(b){
  var list = state.index.filter(function(x){ return x.id !== b.id; });
  list.unshift({ id:b.id, name:b.name, x:b.teamX.short, y:b.teamY.short, at:Date.now() });
  state.index = list.slice(0,12);
  try { localStorage.setItem(IDX, JSON.stringify(state.index)); } catch(e){}
}
function pull(){
  if (!state.boardId || state.writing) return Promise.resolve();
  return Store.get(bKey(state.boardId)).then(function(b){
    state.lastSync = Date.now();
    if (!b) return;
    if (!state.board || b.rev !== state.board.rev || b.updatedAt !== state.board.updatedAt){
      state.board = b;
      render();
    } else {
      syncChip();
    }
  }).catch(function(){
    state.syncErr = "Could not reach the board.";
    syncChip();
  });
}

/* ---------------- claim flow ---------------- */
function claim(cellKey, name, note){
  var mode = state.board.mode;
  return mutate(function(b){
    var existing = b.squares[cellKey];
    if (existing) throw new Error(existing.name + " took that square. Pick another one.");
    if (b.maxPer > 0){
      var mine = 0, k;
      for (k in b.squares){ if (b.squares[k].name.toLowerCase() === name.toLowerCase()) mine++; }
      if (mine >= b.maxPer) throw new Error("Limit is " + b.maxPer + " squares each. " + name + " already has " + mine + ".");
    }
    b.squares[cellKey] = {
      name: name,
      note: note || "",
      status: mode === "request" ? "pending" : "claimed",
      paid: false,
      at: Date.now(),
      by: state.deviceId
    };
  }, function(f){
    var c = f.squares[cellKey];
    return !!c && c.by === state.deviceId;
  });
}

/* ---------------- rendering ---------------- */
function el(id){ return document.getElementById(id); }

function render(){
  var app = el("app");
  if (state.board) applyTeamColors(state.board);
  if (!state.board){ app.innerHTML = renderSetupPrompt(); bindGlobal(); return; }
  var b = state.board;
  app.innerHTML =
    renderMatchup(b) +
    renderInfo(b) +
    renderBoard(b) +
    renderScores(b) +
    renderPayouts(b) +
    renderRequests(b) +
    renderRoster(b) +
    renderRules(b) +
    renderFooter(b);
  bindGlobal();
  bindBoard();
}

function renderSetupPrompt(){
  var recent = state.index.map(function(x){
    return '<button class="btn sm" data-open="' + esc(x.id) + '">' + esc(x.name) + " " + esc(x.x) + "/" + esc(x.y) + "</button>";
  }).join("");
  return '<section><div class="card"><div class="empty">' +
    "<strong>No board on this device yet.</strong>" +
    "Set the two teams, the price per square, and the payouts. Then share the link and let people claim their squares." +
    '</div><div class="btnrow"><button class="btn primary full" id="createBoard">Create a board</button></div>' +
    (recent ? '<div class="note"><b>Recent boards</b><div class="btnrow" style="margin-top:8px">' + recent + "</div></div>" : "") +
    '<div class="note" style="margin-top:10px"><b>Joining someone else\'s pool?</b><div class="two" style="margin-top:8px">' +
      '<input id="joinCode" placeholder="board code" maxlength="8" style="min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">' +
      '<button class="btn" id="joinGo">Open board</button></div></div>' +
    "</div></section>";
}

function latestScore(b){
  for (var i = PERIODS.length - 1; i >= 0; i--){
    var s = b.scores[PERIODS[i].key];
    if (s && s.x != null && s.y != null) return s;
  }
  return null;
}
function renderMatchup(b){
  var live = latestScore(b);
  function card(t, axis, val){
    return '<div class="team" style="--tc:' + esc(t.color) + ";--tci:" + inkOn(t.color) + '">' +
      logoImg(t, "tlogo") +
      '<div class="tmeta"><div class="axis">' + axis + "</div><div class=\"nm\">" + esc(t.name) + "</div></div>" +
      (val == null ? "" : '<div class="sc">' + val + "</div>") + "</div>";
  }
  return '<div class="matchup">' +
    card(b.teamY, "Rows, left side", live ? live.y : null) +
    '<div class="vs">VS</div>' +
    card(b.teamX, "Columns, top", live ? live.x : null) +
    "</div>";
}

function renderInfo(b){
  var sold = soldCount(), pot = sold * b.price;
  var owed = b.payouts.reduce(function(a,p){ return a + (Number(p.amount)||0) + (Number(p.reverse)||0); }, 0);
  var chips = "";
  chips += '<span class="chip">' + esc(b.name) + "</span>";
  chips += '<span class="chip">' + money(b.price) + " a square</span>";
  chips += '<span class="chip pot">Pot <b>' + money(pot) + "</b></span>";
  if (owed > pot && sold > 0) chips += '<span class="chip warn">Payouts total ' + money(owed) + ", " + money(owed - pot) + " over the pot</span>";
  chips += '<span class="chip live" id="syncChip">' + syncText() + "</span>";
  var tot = totalSquares(b);
  var bar = '<div class="progress"><div class="bar" style="width:' + Math.round(sold / tot * 100) + '%"></div>' +
    '<div class="lb"><b>' + sold + "</b>/" + tot + " sold" + (sold >= tot ? ", board is full" : ", " + (tot - sold) + " left") + "</div></div>";
  return bar + '<div class="inforow">' + chips + "</div>";
}

function syncText(){
  if (state.syncErr) return state.syncErr;
  if (Store.mode === "firebase") return "Live on your Firebase";
  if (Store.mode === "supabase") return "Live on your Supabase";
  if (Store.mode === "cloud") return "Shared board, live";
  if (Store.mode === "memory") return "Not saved, storage blocked";
  return "This device only, not shared";
}
function syncChip(){
  var c = el("syncChip");
  if (c){
    c.textContent = syncText();
    c.className = "chip " + (state.syncErr || Store.mode === "memory" ? "warn" : "live");
  }
}

function renderBoard(b){
  var wm = winMap(), html = "", x, y, k, s, cls, label, tag, style, w;
  var nc = cols(b), nr = rows(b);
  var perX = Math.floor(10 / nc), perY = Math.floor(10 / nr);
  var drawn = !!(b.digits.x && b.digits.y && b.digits.x.length === nc && b.digits.y.length === nr);
  var gridCss = "grid-template-columns:minmax(0,1.12fr) repeat(" + nc + ",minmax(0,1fr));--zoomw:" + ((nc + 1) * 58) + "px";
  var gridCls = "grid c" + (nc >= 10 ? "10" : "5");

  var axStyleX = "--ax:" + esc(b.teamX.color) + ";--axi:" + inkOn(b.teamX.color);
  var axStyleY = "--ax:" + esc(b.teamY.color) + ";--axi:" + inkOn(b.teamY.color);
  var qx = new Array(perX + 1).join("?"), qy = new Array(perY + 1).join("?");

  html += '<div class="gcell corner"></div>';
  for (x=0;x<nc;x++){
    html += '<div class="gcell axis' + (drawn ? " set" : "") + (perX > 1 ? " multi" : "") +
      '" style="' + axStyleX + '" data-axis="x" data-per="' + perX + '" data-i="' + x + '">' +
      (drawn ? groupText(b.digits.x[x]) : qx) + "</div>";
  }
  for (y=0;y<nr;y++){
    html += '<div class="gcell axis' + (drawn ? " set" : "") + (perY > 1 ? " multi" : "") +
      '" style="' + axStyleY + '" data-axis="y" data-per="' + perY + '" data-i="' + y + '">' +
      (drawn ? groupText(b.digits.y[y]) : qy) + "</div>";
    for (x=0;x<nc;x++){
      k = x + "," + y;
      s = b.squares[k];
      cls = "gcell sq"; label = ""; tag = ""; style = "";
      if (!s){ cls += " free"; }
      else {
        style = "--pc:" + playerColor(s.name) + ";--pi:" + playerInk(s.name);
        if (s.status === "pending"){ cls += " pending"; label = esc(initials(s.name)); }
        else {
          cls += " taken";
          label = esc(initials(s.name));
          if (!s.paid) cls += " unpaid";
        }
        if (s.by === state.deviceId) cls += " mine";
        if (k === state.fresh) cls += " fresh";
      }
      w = wm[k];
      if (w && w.length){
        cls += " win";
        tag = '<span class="tag' + (w[0].kind === "reverse" ? " rev" : "") + '">' +
          (w[0].p.key === "final" ? "F" : w[0].p.key.toUpperCase()) + (w[0].kind === "reverse" ? "R" : "") + "</span>";
      }
      var aria = "Square column " + (x+1) + ", row " + (y+1) + (s ? ", taken by " + s.name : ", open");
      html += '<button class="' + cls + '" style="' + style + '" data-cell="' + k + '" aria-label="' + esc(aria) + '">' + label + tag + "</button>";
    }
  }

  var unpaidCount = 0;
  for (var uk in b.squares){ if (b.squares[uk].status !== "pending" && !b.squares[uk].paid) unpaidCount++; }
  var legend = roster().slice(0,10).map(function(r){
    return '<span class="lg"><span class="sw" style="--c:' + playerColor(r.name) + '"></span>' +
      esc(r.name) + " <b>" + r.total + (r.pending ? "+" + r.pending : "") + "</b></span>";
  }).join("");

  return '<section><div class="boardcard">' +
      '<div class="boardhead"><h2>' + (drawn ? "Numbers are drawn" : "Numbers hidden until the draw") + "</h2>" +
      '<span class="chip" style="margin-left:auto;margin-right:8px">' + nc + " by " + nr + "</span>" +
      '<button class="iconbtn' + (state.zoom ? " on" : "") + '" id="zoomBtn">' + (state.zoom ? "Fit" : "Bigger") + "</button></div>" +
      '<div class="boardscroll' + (state.zoom ? " zoomed" : "") + '" id="boardscroll"><div class="' + gridCls + '" id="grid" style="' + gridCss + '">' + html + "</div></div>" +
      (legend ? '<div class="legend">' + legend + (unpaidCount ? '<span class="lg" style="background:transparent;border:1px dashed var(--line-strong)"><span class="sw" style="--c:var(--ink-3);box-shadow:inset 0 0 0 3px var(--surface)"></span>not paid yet <b>' + unpaidCount + "</b></span>" : "") + "</div>" :
        '<div class="note">Tap any square to put a name on it. Once a name is on it, it locks for everyone else.</div>') +
    "</div></section>";
}

function renderScores(b){
  var rows = PERIODS.map(function(p){
    var s = b.scores[p.key], has = s.x != null && s.y != null;
    var pills = has
      ? '<span class="pill" style="--c:' + esc(b.teamY.color) + ";--ci:" + inkOn(b.teamY.color) + '">' + s.y + "</span>" +
        '<span class="pill" style="--c:' + esc(b.teamX.color) + ";--ci:" + inkOn(b.teamX.color) + '">' + s.x + "</span>"
      : '<span class="pill blank">' + esc(b.teamY.short) + '</span><span class="pill blank">' + esc(b.teamX.short) + "</span>";
    return '<div class="prow' + (has ? " hit" : "") + '"><div class="lbl">' + esc(p.label) + "</div>" +
      '<div class="scorepills">' + pills + "</div></div>";
  }).join("");
  return '<section><div class="sechead"><h2>Score</h2>' +
    (state.isAdmin ? '<button class="btn sm" id="scoreBtn">Enter scores</button>' : "") +
    "</div><div class=\"card\">" + rows + "</div></section>";
}

function renderPayouts(b){
  var rows = b.payouts.map(function(p){
    var w = winners(p.key), sq, rq, sub = "", hit = "";
    if (w){
      sq = b.squares[w.straight]; rq = b.squares[w.reverse];
      hit = " hit";
      sub = "<div class=\"sub\">" + (sq ? '<span class="sw" style="display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px;background:' + playerColor(sq.name) + '"></span>' : "") +
        "Winner <b>" + (sq ? esc(sq.name) : "nobody, that square never sold") + "</b>" +
        (Number(p.reverse) > 0 ? " . Reverse <b>" + (rq ? esc(rq.name) : "unsold") + "</b> for " + money(p.reverse) : "") +
        "</div>";
    }
    return '<div class="prow' + hit + '"><div class="lbl">' + esc(p.label) + "</div>" +
      '<div class="amt">' + money(p.amount) + (Number(p.reverse) > 0 ? ' <span style="color:var(--ink-3)">/ ' + money(p.reverse) + "</span>" : "") +
      "</div>" + sub + "</div>";
  }).join("");
  return '<section><div class="sechead"><h2>Payouts</h2><span class="chip">straight / reverse</span></div>' +
    '<div class="card">' + rows + "</div></section>";
}

function renderRequests(b){
  if (b.mode !== "request") return "";
  var pend = Object.keys(b.squares).filter(function(k){ return b.squares[k].status === "pending"; });
  if (!pend.length){
    return state.isAdmin ? '<section><div class="sechead"><h2>Requests</h2></div><div class="card"><div class="empty">No requests waiting. New ones land here the moment someone taps a square.</div></div></section>' : "";
  }
  var rows = pend.map(function(k){
    var s = b.squares[k], p = k.split(",");
    return '<div class="reqrow"><div class="info"><b>' + esc(s.name) + "</b><span>column " + (Number(p[0])+1) + ", row " + (Number(p[1])+1) + (s.note ? " . " + esc(s.note) : "") + "</span></div>" +
      (state.isAdmin ? '<button class="btn sm primary" data-approve="' + k + '">Approve</button><button class="btn sm danger" data-decline="' + k + '">Decline</button>' : '<span class="chip">waiting</span>') +
      "</div>";
  }).join("");
  return '<section><div class="sechead"><h2>Requests</h2><span class="chip"><b>' + pend.length + "</b> waiting</span></div>" +
    '<div class="card">' + rows + "</div></section>";
}

function renderRoster(b){
  var r = roster();
  if (!r.length) return "";
  var rows = r.map(function(p){
    var owed = (p.total - p.paid) * b.price;
    return '<div class="rrow"><span class="dot" style="--pc:' + playerColor(p.name) + ";--pi:" + playerInk(p.name) + '">' + esc(initials(p.name)) + "</span>" +
      '<span class="nm">' + esc(p.name) + "</span>" +
      '<span class="ct">' + p.total + (p.pending ? " +" + p.pending + " pending" : "") + "</span>" +
      (state.isAdmin ? '<button class="paybtn' + (owed === 0 && p.total ? " paid" : "") + '" data-pay="' + esc(p.name) + '">' + (owed === 0 && p.total ? "paid" : "mark paid") + "</button>" : "") +
      '<span class="owe' + (owed === 0 ? " clear" : "") + '">' + (owed === 0 ? "clear" : money(owed)) + "</span></div>";
  }).join("");
  var totalOwed = r.reduce(function(a,p){ return a + (p.total - p.paid) * b.price; }, 0);
  return '<section><div class="sechead"><h2>Who is in</h2><span class="chip">outstanding <b>' + money(totalOwed) + "</b></span></div>" +
    '<div class="card">' + rows + "</div></section>";
}

function renderRules(b){
  if (!b.rules) return "";
  return '<section><div class="sechead"><h2>Rules</h2></div><div class="card"><div class="rules">' + esc(b.rules) + "</div></div></section>";
}

function renderFooter(b){
  return '<section><div class="note">Board code <b>' + esc(b.id) + "</b>. " +
    (Store.mode === "firebase"
      ? "Running on your own Firebase, so every phone on this link sees the same board."
      : Store.mode === "supabase"
      ? "Running on your own Supabase, so every phone on this link sees the same board."
      : Store.mode === "cloud"
      ? "Everyone opening this page shares one board, and a claim locks it for all of them."
      : "This copy is saved on this device only. Add your database in the Admin Sync tab to share it across phones.") +
    "</div></section>";
}

/* ---------------- board grid binding ---------------- */
function bindBoard(){
  var grid = el("grid");
  if (!grid) return;
  grid.addEventListener("click", function(e){
    var cell = e.target.closest("[data-cell]");
    if (cell) return openClaim(cell.getAttribute("data-cell"));
    var ax = e.target.closest("[data-axis]");
    if (ax){
      if (state.board.digits.x) return;
      if (state.isAdmin) openAdmin("numbers");
      else toast("The organiser draws the numbers once the board fills up.");
    }
  });
  var z = el("zoomBtn");
  if (z) z.onclick = function(){
    state.zoom = !state.zoom;
    el("boardscroll").classList.toggle("zoomed", state.zoom);
    z.textContent = state.zoom ? "Fit" : "Bigger";
    z.classList.toggle("on", state.zoom);
  };
  /* fade the board back in so changing grid size or numbers does not snap */
  grid.classList.add("settling");
  var clear = function(){ grid.classList.remove("settling"); };
  requestAnimationFrame(function(){ requestAnimationFrame(clear); });
  setTimeout(clear, 220); // rAF is throttled in a background tab, never leave the board invisible
  var sb = el("scoreBtn");
  if (sb) sb.onclick = function(){ openAdmin("scores"); };
}

function bindGlobal(){
  var cb = el("createBoard");
  if (cb) cb.onclick = function(){
    var b = newBoard();
    state.boardId = b.id;
    saveBoard(b).then(function(){
      state.isAdmin = true;
      savePrefs({ lastBoard: b.id });
      setHash(b.id);
      render();
      openAdmin("setup");
    }).catch(function(err){ toast(err.message, true); });
  };
  var jg = el("joinGo");
  if (jg) jg.onclick = function(){
    var code = (el("joinCode").value || "").trim().toLowerCase();
    if (!code) return toast("Type the board code first", true);
    loadBoard(code);
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-open]"), function(btn){
    btn.onclick = function(){ loadBoard(btn.getAttribute("data-open")); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-approve]"), function(btn){
    btn.onclick = function(){ setStatus(btn.getAttribute("data-approve"), "claimed"); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-decline]"), function(btn){
    btn.onclick = function(){ removeSquare(btn.getAttribute("data-decline")); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-pay]"), function(btn){
    btn.onclick = function(){ togglePaid(btn.getAttribute("data-pay")); };
  });
}

function setStatus(k, status){
  mutate(function(b){
    if (!b.squares[k]) throw new Error("That request is already dealt with.");
    b.squares[k].status = status;
  }).then(function(){ render(); toast("Square approved"); })
    .catch(function(e){ toast(e.message, true); render(); });
}
function removeSquare(k){
  mutate(function(b){ delete b.squares[k]; })
    .then(function(){ render(); toast("Square is open again"); })
    .catch(function(e){ toast(e.message, true); render(); });
}
function togglePaid(name){
  var any = false;
  mutate(function(b){
    var k;
    any = false;
    for (k in b.squares){ if (b.squares[k].name === name && !b.squares[k].paid) any = true; }
    for (k in b.squares){ if (b.squares[k].name === name) b.squares[k].paid = any; }
  }).then(function(){ render(); toast(any ? name + " marked paid" : name + " marked unpaid"); })
    .catch(function(e){ toast(e.message, true); render(); });
}

/* ---------------- sheet ---------------- */
var sheetOpen = false;
function openSheet(html, onMount){
  var s = el("sheet");
  s.innerHTML = '<button class="closebtn" id="sheetClose" aria-label="Close">&times;</button><div class="grab"></div>' + html;
  el("scrim").classList.add("open");
  s.classList.add("open");
  sheetOpen = true;
  el("sheetClose").onclick = closeSheet;
  if (onMount) onMount();
}
function closeSheet(){
  el("sheet").classList.remove("open");
  el("scrim").classList.remove("open");
  sheetOpen = false;
}
el("scrim").onclick = closeSheet;
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && sheetOpen) closeSheet(); });

var toastTimer;
function toast(msg, bad){
  var t = el("toast");
  t.textContent = msg;
  t.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = "toast" + (bad ? " bad" : ""); }, 3400);
}

/* ---------------- claim sheet ---------------- */
function openClaim(k){
  var b = state.board, s = b.squares[k], p = k.split(",");
  var col = Number(p[0]), row = Number(p[1]);
  var drawn = !!(b.digits.x && b.digits.y);
  var coord = drawn
    ? esc(b.teamX.short) + " ends in " + b.digits.x[col] + ", " + esc(b.teamY.short) + " ends in " + b.digits.y[row]
    : "column " + (col+1) + ", row " + (row+1) + ", numbers not drawn yet";

  if (s){
    var body = '<div class="sheethead"><h3>' + esc(s.name) + "</h3><p>" + coord + "</p></div>" +
      '<div class="sqpreview"><div class="box" style="border-color:' + playerColor(s.name) + '">' + esc(initials(s.name)) + "</div>" +
      '<div class="meta"><b>' + (s.status === "pending" ? "Waiting on approval" : "Locked in") + "</b>" +
      (s.paid ? "Paid" : "Not paid yet") + (s.note ? " . " + esc(s.note) : "") + "</div></div>";
    if (state.isAdmin){
      body += '<div class="btnrow">' +
        (s.status === "pending" ? '<button class="btn primary" id="apr">Approve</button>' : "") +
        '<button class="btn" id="tog">' + (s.paid ? "Mark unpaid" : "Mark paid") + "</button>" +
        '<button class="btn danger" id="rem">Free this square</button></div>';
    } else {
      body += '<div class="note">This one is gone. Every other open square is still up for grabs.</div>';
    }
    openSheet(body, function(){
      var a = el("apr"), t = el("tog"), r = el("rem");
      if (a) a.onclick = function(){ closeSheet(); setStatus(k,"claimed"); };
      if (t) t.onclick = function(){
        mutate(function(b2){ if (b2.squares[k]) b2.squares[k].paid = !b2.squares[k].paid; })
          .then(function(){ closeSheet(); render(); })
          .catch(function(e){ toast(e.message, true); });
      };
      if (r) r.onclick = function(){ closeSheet(); removeSquare(k); };
    });
    return;
  }

  var known = roster().map(function(r){
    return '<button class="pick" data-name="' + esc(r.name) + '">' + esc(r.name) + "</button>";
  }).join("");
  var isReq = b.mode === "request";
  var head = '<div class="sheethead"><h3>' + (isReq ? "Request this square" : "Claim this square") + "</h3><p>" + coord + "</p></div>";
  var form =
    '<div class="sqpreview"><div class="box">' + (col+1) + "/" + (row+1) + "</div>" +
      '<div class="meta"><b>' + money(b.price) + "</b>" + (isReq ? "The organiser approves it before it is yours." : "It locks the second you claim it.") + "</div></div>" +
    (known ? '<div class="field"><label>Already on the board</label><div class="pickgrid">' + known + "</div></div>" : "") +
    '<div class="field" id="fName"><label>Your name</label><input id="nm" placeholder="Rocha" autocomplete="name" value="' + esc(state.me) + '" maxlength="24">' +
      '<div class="errmsg">Put a name in so people know whose square this is.</div></div>' +
    (isReq ? '<div class="field"><label>Note for the organiser</label><input id="note" placeholder="Paying Friday" maxlength="60"></div>' : "") +
    '<button class="btn primary full" id="go">' + (isReq ? "Send request" : "Claim it") + "</button>" +
    '<div class="note">' + (b.maxPer > 0 ? "Limit " + b.maxPer + " squares per person. " : "") +
      "Once this goes through, nobody else can take it.</div>";

  openSheet(head + form, function(){
    var input = el("nm");
    Array.prototype.forEach.call(document.querySelectorAll("[data-name]"), function(btn){
      btn.onclick = function(){
        Array.prototype.forEach.call(document.querySelectorAll("[data-name]"), function(o){ o.classList.remove("on"); });
        btn.classList.add("on");
        input.value = btn.getAttribute("data-name");
      };
    });
    el("go").onclick = function(){
      var name = (input.value || "").trim();
      if (!name){ el("fName").classList.add("err"); input.focus(); return; }
      el("fName").classList.remove("err");
      var note = el("note") ? el("note").value.trim() : "";
      var btn = el("go");
      btn.disabled = true; btn.textContent = "Saving";
      state.me = name; savePrefs({ me: name });
      claim(k, name, note).then(function(){
        state.fresh = k;
        closeSheet(); render();
        if (!isReq) burst(playerColor(name));
        setTimeout(function(){ state.fresh = null; }, 700);
        toast(isReq ? "Request sent to the organiser" : "Square locked in for " + name);
      }).catch(function(err){
        btn.disabled = false; btn.textContent = isReq ? "Send request" : "Claim it";
        toast(err.message, true);
        render();
      });
    };
  });
}
