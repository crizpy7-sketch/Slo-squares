<style>

  color-scheme:light dark;
  --font-display:'Space Grotesk','Inter',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
  --bg:#f3f7fb;--bg-2:#e8f0f8;--surface:#ffffff;--surface-2:#f4f7fb;--surface-3:#eaf0f6;
  --ink:#0b1727;--ink-2:#526274;--ink-3:#8391a1;--line:#d9e2ec;--line-strong:#b8c6d5;
  --accent:#0d6efd;--accent-2:#00c2ff;--accent-soft:#e8f2ff;--accent-ink:#ffffff;
  --ok:#0fa968;--ok-soft:#e7f8f0;--danger:#e5424d;--danger-soft:#ffedef;--warning:#f7a51a;
  --shadow-sm:0 1px 2px rgba(16,35,58,.06),0 6px 18px rgba(16,35,58,.06);
  --shadow:0 18px 55px rgba(18,39,65,.12);--shadow-xl:0 30px 90px rgba(7,20,38,.28);
  --radius-sm:10px;--radius:16px;--radius-lg:24px;--radius-xl:30px;
  --tx:#97233F;--tx-ink:#fff;--ty:#0085CA;--ty-ink:#fff;
}
@media(prefers-color-scheme:dark){html[data-theme="auto"]{
  --bg:#07111e;--bg-2:#0b1828;--surface:#0f1d2d;--surface-2:#142538;--surface-3:#1b2f45;
  --ink:#f5f8fc;--ink-2:#aebdcd;--ink-3:#73849a;--line:#23384f;--line-strong:#36516d;
  --accent:#4c8dff;--accent-2:#25d5ff;--accent-soft:#102b50;--accent-ink:#fff;
  --ok:#39d590;--ok-soft:#103426;--danger:#ff6972;--danger-soft:#3b1a22;--warning:#ffc24a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow:0 22px 65px rgba(0,0,0,.38);--shadow-xl:0 32px 100px rgba(0,0,0,.55);
}}
html[data-theme="dark"]{
  --bg:#07111e;--bg-2:#0b1828;--surface:#0f1d2d;--surface-2:#142538;--surface-3:#1b2f45;
  --ink:#f5f8fc;--ink-2:#aebdcd;--ink-3:#73849a;--line:#23384f;--line-strong:#36516d;
  --accent:#4c8dff;--accent-2:#25d5ff;--accent-soft:#102b50;--accent-ink:#fff;
  --ok:#39d590;--ok-soft:#103426;--danger:#ff6972;--danger-soft:#3b1a22;--warning:#ffc24a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow:0 22px 65px rgba(0,0,0,.38);--shadow-xl:0 32px 100px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--bg)}
html,body{margin:0;padding:0}
body{min-height:100dvh;background:
  radial-gradient(circle at 8% -10%,color-mix(in srgb,var(--accent-2) 14%,transparent),transparent 30%),
  radial-gradient(circle at 95% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 28%),var(--bg);
  color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom);}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 48%,transparent);outline-offset:2px}
button:disabled,input:disabled,select:disabled,textarea:disabled{opacity:.52;cursor:not-allowed}
.wrap{width:min(1440px,100%);margin:0 auto;padding:26px clamp(16px,3vw,40px) 110px}

/* Premium app bar */
.topbar{position:sticky;top:0;z-index:50;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(22px) saturate(160%);border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent)}
.topbar::after{content:"";position:absolute;inset:auto 0 -1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent-2),var(--accent),transparent);opacity:.55}
.topbar-in{width:min(1440px,100%);margin:auto;padding:12px clamp(16px,3vw,40px);display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:-.03em}
.brand .sq{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:10px;letter-spacing:.06em;background:linear-gradient(135deg,var(--accent-2),var(--accent));box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 28%,transparent),inset 0 1px 0 rgba(255,255,255,.45)}
.brand .word::after{content:" GAME HUB";font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;color:var(--ink-3);margin-left:8px;vertical-align:2px}
.spacer{flex:1}
.iconbtn{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--ink-2);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;box-shadow:var(--shadow-sm);transition:transform .18s ease,border-color .18s ease,background .18s ease,color .18s ease}
.iconbtn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--ink);background:var(--surface)}
.iconbtn.on{background:linear-gradient(135deg,var(--accent-2),var(--accent));border-color:transparent;color:#fff}

/* Trial and game header */
.trialbar{display:flex;align-items:center;gap:12px;padding:12px 15px;border-radius:16px;background:linear-gradient(100deg,color-mix(in srgb,var(--accent) 11%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));box-shadow:var(--shadow-sm);margin-bottom:16px}
.trialbar .trial-icon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:800;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 28%,transparent)}
.trialbar .trial-copy{min-width:0;flex:1}.trialbar b{display:block;font-size:14px}.trialbar span{display:block;color:var(--ink-2);font-size:12px;margin-top:1px}
.matchup{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 90px minmax(0,1fr);align-items:stretch;gap:14px;margin:0 0 14px;padding:18px;border-radius:var(--radius-xl);background:linear-gradient(145deg,color-mix(in srgb,var(--surface) 92%,transparent),color-mix(in srgb,var(--surface-2) 88%,transparent));border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.matchup::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,color-mix(in srgb,var(--ty) 10%,transparent),transparent 38%,transparent 62%,color-mix(in srgb,var(--tx) 10%,transparent));pointer-events:none}
.team{position:relative;min-width:0;min-height:118px;border-radius:22px;padding:20px 22px;overflow:hidden;display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 92%,#07111e),var(--tc));color:var(--tci);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 18px 36px color-mix(in srgb,var(--tc) 22%,transparent);transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.team:hover{transform:translateY(-3px)}
.team::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-80px;top:-100px;background:rgba(255,255,255,.13)}
.tlogo{width:62px;height:62px;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.3));z-index:1}.tmeta{min-width:0;z-index:1}.team .axis{font-family:var(--font-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;opacity:.76}.team .nm{font-family:var(--font-display);font-size:clamp(18px,2vw,28px);font-weight:700;line-height:1.05;letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.team .sc{margin-left:auto;z-index:1;font-family:var(--font-display);font-size:46px;font-weight:700;letter-spacing:-.06em}.vs{position:relative;align-self:center;justify-self:center;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);font-family:var(--font-display);font-weight:700;color:var(--ink-2);z-index:2}
.game-meta{display:grid;grid-template-columns:minmax(280px,1fr) auto;gap:12px;align-items:center;margin-bottom:18px}.progress{position:relative;height:44px;border-radius:14px;background:var(--surface);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-sm)}.progress .bar{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .55s cubic-bezier(.2,.8,.2,1)}.progress .bar::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.34) 45%,transparent 65%);transform:translateX(-100%);animation:shine 3s ease-in-out infinite}@keyframes shine{55%,100%{transform:translateX(180%)}}.progress .lb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:7px;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.42)}.progress .lb b{font-size:15px}.inforow{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;min-height:32px;font-family:var(--font-mono);font-size:10.5px;font-weight:700;letter-spacing:.01em;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 11px;color:var(--ink-2);box-shadow:var(--shadow-sm)}.chip b{color:var(--ink)}.chip.live{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:var(--accent-soft);color:var(--accent)}.chip.warn{border-color:color-mix(in srgb,var(--danger) 55%,var(--line));color:var(--danger);background:var(--danger-soft)}.chip.pot{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));color:var(--ok);background:var(--ok-soft)}

/* Desktop game workspace */
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}.boardpane{min-width:0}.sidepane{min-width:0;position:sticky;top:82px}.sidepane section:first-child{margin-top:0}
section{margin-top:18px}.boardpane section{margin-top:0}.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 9px}.sechead h2{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0;display:flex;align-items:center;gap:8px}.sechead h2::before{content:"";width:5px;height:18px;border-radius:99px;background:linear-gradient(var(--accent-2),var(--accent))}
.card,.boardcard{background:linear-gradient(145deg,color-mix(in srgb,var(--surface) 97%,transparent),color-mix(in srgb,var(--surface-2) 88%,transparent));border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}.card{padding:16px}.card+.card{margin-top:10px}
.boardcard{padding:18px;box-shadow:var(--shadow);overflow:hidden}.boardhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}.boardhead h2{font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:-.02em;margin:0}.boardhead h2::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 5px color-mix(in srgb,var(--ok) 16%,transparent);margin-right:10px;vertical-align:2px}
.boardscroll{position:relative;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:10px;border-radius:20px;background:linear-gradient(145deg,var(--bg-2),color-mix(in srgb,var(--surface-2) 85%,var(--bg)));border:1px solid var(--line);scrollbar-color:var(--line-strong) transparent;scrollbar-width:thin}.boardscroll::-webkit-scrollbar{height:10px;width:10px}.boardscroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid transparent;background-clip:padding-box}.grid{display:grid;gap:6px;width:100%;min-width:760px;margin:auto;transition:opacity .18s ease}.grid.c5{min-width:520px;max-width:760px}.boardscroll.zoomed .grid{width:auto;min-width:var(--zoomw,760px)}.grid.settling{opacity:0}
.gcell{aspect-ratio:1;min-width:0;position:relative;display:grid;place-items:center;border-radius:12px;font-family:var(--font-mono);transition:transform .16s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease,color .18s ease;isolation:isolate}.gcell.corner{position:sticky;top:0;left:0;z-index:11;background:var(--bg-2)}.gcell[data-axis="x"]{position:sticky;top:0;z-index:10}.gcell[data-axis="y"]{position:sticky;left:0;z-index:9}.gcell.axis{background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px dashed color-mix(in srgb,var(--ax) 58%,var(--line));color:var(--ax);font-weight:800;font-size:clamp(12px,1.6vw,19px)}.gcell.axis::before{content:"?";opacity:.18;position:absolute;font-size:180%;z-index:-1}.gcell.axis.set{border:0;background:linear-gradient(145deg,color-mix(in srgb,var(--ax) 86%,#000),var(--ax));color:var(--axi);box-shadow:0 8px 18px color-mix(in srgb,var(--ax) 22%,transparent),inset 0 1px 0 rgba(255,255,255,.28)}.gcell.axis.set::before{display:none}.gcell.axis.multi{letter-spacing:-.06em;font-size:clamp(10px,1.35vw,16px)}.gcell.axis.rolling{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff;border-style:solid}.gcell.axis.pop{animation:cellPop .34s cubic-bezier(.2,1.4,.4,1)}@keyframes cellPop{0%{transform:scale(.72)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.sq{appearance:none;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);color:var(--ink-3);overflow:hidden;cursor:pointer;touch-action:manipulation;user-select:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}.sq.free::before{content:"+";font-family:var(--font-display);font-size:20px;font-weight:600;opacity:.18;transition:opacity .18s ease,transform .18s ease}.sq.free:hover{z-index:4;border-color:var(--accent);background:var(--accent-soft);box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 18%,transparent)}.sq.free:hover::before{opacity:.95;color:var(--accent);transform:scale(1.12)}.sq:active{transform:scale(.96)}.sq.taken{background:linear-gradient(145deg,color-mix(in srgb,var(--pc) 88%,#fff),var(--pc));border-color:transparent;color:var(--pi);font-family:var(--font-display);font-size:clamp(9px,1.25vw,14px);font-weight:700;letter-spacing:-.03em;box-shadow:0 8px 20px color-mix(in srgb,var(--pc) 20%,transparent),inset 0 1px 0 rgba(255,255,255,.28)}.sq.taken:hover{z-index:4;transform:translateY(-2px);filter:saturate(1.08)}.sq.pending{background:repeating-linear-gradient(135deg,var(--pc),var(--pc) 6px,color-mix(in srgb,var(--pc) 68%,#000) 6px,color-mix(in srgb,var(--pc) 68%,#000) 12px);border:2px dashed rgba(255,255,255,.85);color:var(--pi);font-weight:700}.sq.mine{outline:3px solid var(--ink);outline-offset:-4px}.sq.win{z-index:3;border-color:var(--warning);box-shadow:0 0 0 3px color-mix(in srgb,var(--warning) 72%,transparent),0 0 28px color-mix(in srgb,var(--warning) 44%,transparent),inset 0 1px 0 rgba(255,255,255,.34);animation:winGlow 1.8s ease-in-out infinite}@keyframes winGlow{50%{box-shadow:0 0 0 3px var(--warning),0 0 36px color-mix(in srgb,var(--warning) 58%,transparent),inset 0 1px 0 rgba(255,255,255,.34)}}.sq.fresh{animation:landed .46s cubic-bezier(.2,1.5,.4,1)}@keyframes landed{0%{transform:scale(.55);opacity:.2}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}.sq .tag{position:absolute;top:4px;right:4px;min-width:20px;height:18px;padding:0 4px;border-radius:6px;display:grid;place-items:center;background:var(--warning);color:#241600;font-family:var(--font-mono);font-size:8px;font-weight:800}.sq .tag.rev{background:var(--ink);color:var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.lg{display:inline-flex;align-items:center;gap:7px;min-height:30px;font-size:11px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 5px}.lg .sw{width:20px;height:20px;border-radius:7px;background:var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}.lg b{font-family:var(--font-mono);font-size:10px;color:var(--ink)}

/* Side cards */
.prow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.prow:last-child{border-bottom:0;padding-bottom:0}.prow:first-child{padding-top:0}.prow .lbl{font-size:14px;font-weight:700}.prow .amt{font-family:var(--font-mono);font-size:13px;font-weight:700;text-align:right;white-space:nowrap}.prow .sub{grid-column:1/-1;font-size:12px;color:var(--ink-2)}.prow .sub b{color:var(--ink)}.prow.hit{background:var(--accent-soft);margin:0 -10px;padding:11px 10px;border:0;border-radius:12px}.scorepills{display:flex;gap:6px}.pill{min-width:45px;padding:5px 9px;border-radius:9px;text-align:center;background:var(--c);color:var(--ci);font-family:var(--font-display);font-size:15px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}.pill.blank{background:var(--surface-2);border:1px solid var(--line);box-shadow:none;color:var(--ink-3);font-family:var(--font-mono);font-size:10px}.rrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.rrow:last-child{border-bottom:0}.rrow .dot{width:34px;height:28px;border-radius:9px;background:var(--pc);color:var(--pi);display:grid;place-items:center;font-family:var(--font-display);font-size:10px;font-weight:700}.rrow .nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rrow .ct{font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}.rrow .owe{min-width:60px;text-align:right;font-family:var(--font-mono);font-size:12px;font-weight:700}.rrow .owe.clear{color:var(--ok)}.rules{white-space:pre-wrap;font-size:13px;line-height:1.65}.empty{padding:24px 6px;color:var(--ink-2)}.empty strong{display:block;color:var(--ink);font-family:var(--font-display);font-size:20px;margin-bottom:5px}

/* Controls */
.btn{min-height:46px;padding:0 17px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:14px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,filter .18s ease}.btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 42%,var(--line));box-shadow:var(--shadow-sm)}.btn.primary{background:linear-gradient(135deg,var(--accent-2),var(--accent));border-color:transparent;color:#fff;box-shadow:0 12px 26px color-mix(in srgb,var(--accent) 30%,transparent)}.btn.primary:hover{filter:brightness(1.06)}.btn.danger{color:var(--danger);background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}.btn.full{width:100%}.btn.sm{min-height:36px;padding:0 12px;border-radius:10px;font-size:12px}.btnrow{display:flex;gap:9px;flex-wrap:wrap}.btnrow .btn{flex:1;min-width:120px}
.field{margin-bottom:14px}.field label{display:block;margin-bottom:6px;color:var(--ink-2);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.field input,.field select,.field textarea{width:100%;min-height:48px;padding:11px 13px;border-radius:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);box-shadow:inset 0 1px 2px rgba(0,0,0,.03);transition:border-color .18s ease,box-shadow .18s ease}.field textarea{min-height:104px;resize:vertical;line-height:1.55}.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 13%,transparent)}.field .hint{font-size:12px;color:var(--ink-3);margin-top:6px}.field.err input{border-color:var(--danger)}.field .errmsg{display:none;color:var(--danger);font-size:12px;margin-top:5px}.field.err .errmsg{display:block}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}input[type="color"]{padding:4px;height:48px}
.note{font-size:12.5px;color:var(--ink-2);line-height:1.55;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-top:10px}.note b{color:var(--ink)}

    body='<div class="field"><label>Board name</label><input id="a_name" value="'+esc(b.name)+'" maxlength="40"'+(editable?'':' disabled')+'></div>'+teamPicker("y",b.teamY,editable)+'<div class="two"><div class="field"><label>Name</label><input id="a_yname" value="'+esc(b.teamY.name)+'" maxlength="28"'+(editable?'':' disabled')+'></div><div class="field"><label>Short</label><input id="a_yshort" value="'+esc(b.teamY.short)+'" maxlength="4"'+(editable?'':' disabled')+'></div></div><div class="field"><label>Color</label><input type="color" id="a_ycolor" value="'+esc(b.teamY.color)+'"'+(editable?'':' disabled')+'></div>'+teamPicker("x",b.teamX,editable)+'<div class="two"><div class="field"><label>Name</label><input id="a_xname" value="'+esc(b.teamX.name)+'" maxlength="28"'+(editable?'':' disabled')+'></div><div class="field"><label>Short</label><input id="a_xshort" value="'+esc(b.teamX.short)+'" maxlength="4"'+(editable?'':' disabled')+'></div></div><div class="field"><label>Color</label><input type="color" id="a_xcolor" value="'+esc(b.teamX.color)+'"'+(editable?'':' disabled')+'></div><div class="field"><label>Claim mode</label><select id="a_mode"'+(editable?'':' disabled')+'><option value="instant"'+(b.mode==="instant"?' selected':'')+'>Instant claim</option><option value="request"'+(b.mode==="request"?' selected':'')+'>Organizer approval</option></select></div><div class="field"><label>Rules</label><textarea id="a_rules" maxlength="800"'+(editable?'':' disabled')+'>'+esc(b.rules)+'</textarea></div><div class="field"><label>Change organizer PIN</label><input id="a_pin" type="tel" inputmode="numeric" maxlength="8" placeholder="Leave blank to keep it"'+(editable?'':' disabled')+'></div>'+(editable?'<button class="btn primary full" id="a_save">Save board</button>':'<div class="note">Board settings freeze when the board locks.</div>')+'<div class="btnrow" style="margin-top:9px"><button class="btn" id="a_export">Export backup</button><button class="btn" id="a_import">Restore backup</button><button class="btn" id="a_new">New board</button></div><input type="file" id="a_file" accept="application/json,.json" style="display:none">'+(editable?'<div class="btnrow" style="margin-top:9px"><button class="btn danger full" id="a_clear">Clear every square</button></div>':'');
  } else if(tab==="layout"){
    var nc=cols(b),nr=rows(b),placed=reservedCount(b);body='<div class="note">Choose the size before anyone claims a square. Once a square exists, changing the grid is disabled so no player loses a position.</div><div class="field" style="margin-top:12px"><label>Board size</label>'+GRIDS.map(function(g){var on=g.cols===nc&&g.rows===nr;return '<button class="gridopt'+(on?' on':'')+'" data-grid="'+g.cols+'x'+g.rows+'"'+(!editable||placed?' disabled':'')+'><span class="gt">'+g.label+'</span><span class="gs">'+g.sub+'</span><span class="gnow">'+(on?'now':g.total)+'</span></button>';}).join("")+'</div><div class="field"><label>Team placement</label><div class="swapbox"><span class="swapside" style="background:'+esc(b.teamY.color)+';color:'+inkOn(b.teamY.color)+'">'+esc(b.teamY.short)+' down side</span><span class="swapside" style="background:'+esc(b.teamX.color)+';color:'+inkOn(b.teamX.color)+'">'+esc(b.teamX.short)+' across top</span></div><button class="btn full" id="l_swap" style="margin-top:9px"'+(!editable||placed?' disabled':'')+'>Swap teams</button></div>'+(placed?'<div class="note"><b>'+placed+' squares are reserved.</b> Start a new board to use a different grid size.</div>':'');
  } else if(tab==="points"){
    body=b.rewards.map(function(r,i){return '<div class="card" style="margin-bottom:9px"><div class="field"><label>Period</label><input data-r="'+i+'" data-f="label" value="'+esc(r.label)+'" maxlength="22"'+(editable?'':' disabled')+'></div><div class="two"><div class="field"><label>Winner points</label><input data-r="'+i+'" data-f="points" type="number" min="0" value="'+r.points+'"'+(editable?'':' disabled')+'></div><div class="field"><label>Reverse points</label><input data-r="'+i+'" data-f="reverse" type="number" min="0" value="'+r.reverse+'"'+(editable?'':' disabled')+'></div></div></div>';}).join("")+(editable?'<button class="btn primary full" id="r_save">Save point values</button>':'<div class="note">Point values freeze when the board locks.</div>');
  } else if(tab==="numbers"){
    var pend=pendingCount(b),openAfterLock=totalSquares(b)-claimedCount(b),drawn=!!b.digits.x;
    body='<div class="note"><b>'+statusLabel(b)+'</b><br>'+(b.status==="open"?'You may lock the board even with open squares. Pending requests are removed. Open winning squares earn 0 points.':b.status==="locked"?'Claims are closed. The number draw is now safe.':'Numbers are final and no new claims are possible.')+'</div><div class="btnrow" style="margin-top:12px">'+(b.status==="open"?'<button class="btn primary full" id="n_lock"'+(trialExpired(b)?' disabled':'')+'>Lock board'+(openAfterLock?' with '+openAfterLock+' open':'')+'</button>':b.status==="locked"?'<button class="btn primary full" id="n_draw"'+(trialExpired(b)?' disabled':'')+'>Draw numbers</button><button class="btn" id="n_unlock">Reopen before draw</button>':'<button class="btn danger full" id="n_reset"'+(trialExpired(b)?' disabled':'')+'>Reset draw</button>')+'</div>'+(pend?'<div class="note">'+pend+' pending request'+(pend===1?' will':'s will')+' be removed when locking.</div>':'')+(drawn?'<div class="note">Drawn '+new Date(b.digits.drawnAt).toLocaleString()+'. Resetting clears all scores but keeps claims locked.</div>':'');
  } else if(tab==="scores"){
    body=PERIODS.map(function(p){var s=b.scores[p.key];return '<div class="card" style="margin-bottom:9px"><div class="field"><label>'+esc(p.label)+'</label><div class="two"><input data-s="'+p.key+'" data-t="y" type="number" min="0" placeholder="'+esc(b.teamY.short)+'" value="'+(s.y==null?'':s.y)+'"><input data-s="'+p.key+'" data-t="x" type="number" min="0" placeholder="'+esc(b.teamX.short)+'" value="'+(s.x==null?'':s.x)+'"></div></div></div>';}).join("")+(b.digits.x&&!trialExpired(b)?'<button class="btn primary full" id="s_save">Save scores</button>':'<div class="note">Draw numbers before entering scores.</div>');
  } else {
    body='<div class="note"><b>Firebase Realtime Database + Anonymous Authentication</b><br>Use a dedicated Firebase project. Enable Anonymous sign-in, paste the secure rules below, then connect and upload this board.</div><div class="note" style="border:1px solid var(--accent)"><b>Keep this organizer browser.</b><br>The board owner is tied to this browser data and its anonymous Firebase account. Export a backup before clearing browser data. Account-based organizer recovery will be added with subscriptions.</div>'+      '<div class="field" style="margin-top:12px"><label>Realtime Database URL</label><input id="fb_url" placeholder="https://your-project-default-rtdb.firebaseio.com" value="'+esc(FB.url)+'" autocapitalize="off" autocorrect="off"></div>'+      '<div class="field"><label>Firebase Web API Key</label><input id="fb_key" placeholder="AIza..." value="'+esc(FB.key)+'" autocapitalize="off" autocorrect="off"><div class="hint">Firebase Console → Project settings → General → Web API Key. The key identifies the project; Security Rules protect the data.</div></div>'+      '<div class="btnrow"><button class="btn" id="fb_test">Test auth & rules</button><button class="btn primary" id="fb_save">Connect & upload</button></div>'+      (fbConfigured()?'<div class="btnrow" style="margin-top:9px"><button class="btn danger full" id="fb_clear">Disconnect this device</button></div>':'')+      '<div class="field" style="margin-top:14px"><label>Firebase Rules</label><textarea id="fb_rules" readonly style="min-height:300px;font-family:var(--font-mono);font-size:11px">'+esc(FB_RULES)+'</textarea><button class="btn sm" id="fb_copy" style="margin-top:7px">Copy secure rules</button><div class="hint">Board controls are owner-only. Claims are atomic, limited to valid open cells, and blocked after the trial or board lock. Trial dates and plan status cannot be changed by the browser.</div></div>';
  }
  openSheet('<div class="sheethead"><h3>Organizer</h3><p>'+esc(b.name)+', board '+esc(b.id)+'</p></div>'+tabs+body,function(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-tab]"),function(t){t.onclick=function(){openAdmin(t.getAttribute("data-tab"));};});
    if(tab==="setup")bindSetup(editable);if(tab==="layout")bindLayout(editable);if(tab==="points")bindRewards(editable);if(tab==="numbers")bindNumbers();if(tab==="scores")bindScores();if(tab==="sync")bindFirebase();
  });
}
function bindPicker(side){var sel=el("a_"+side+"pick");if(!sel||sel.disabled)return;sel.onchange=function(){var v=sel.value,prev=el("a_"+side+"prev");if(v===""){el("a_"+side+"logo").value="";if(prev)prev.remove();return;}var t=NFL[Number(v)],url=logoUrl(t[3]);el("a_"+side+"name").value=t[1];el("a_"+side+"short").value=t[0];el("a_"+side+"color").value=t[2];el("a_"+side+"logo").value=url;if(prev)prev.src=url;};}
function bindSetup(editable){
  bindPicker("y");bindPicker("x");
  if(editable&&el("a_save"))el("a_save").onclick=function(){var v={name:el("a_name").value.trim(),yn:el("a_yname").value.trim(),ys:el("a_yshort").value.trim(),yc:el("a_ycolor").value,ylogo:el("a_ylogo").value,xn:el("a_xname").value.trim(),xs:el("a_xshort").value.trim(),xc:el("a_xcolor").value,xlogo:el("a_xlogo").value,mode:el("a_mode").value,rules:el("a_rules").value,pin:el("a_pin").value.trim()};var prep=Promise.resolve(v);if(v.pin){v.pinSalt=state.board.pinSalt||uid(18);prep=hashPin(v.pin,v.pinSalt).then(function(h){v.pinHash=h;return v;});}prep.then(function(){return mutate(function(b){assertOpen(b);b.name=v.name||b.name;b.teamY.name=v.yn||b.teamY.name;b.teamY.short=(v.ys||b.teamY.short).toUpperCase();b.teamY.color=v.yc;b.teamY.logo=v.ylogo;b.teamX.name=v.xn||b.teamX.name;b.teamX.short=(v.xs||b.teamX.short).toUpperCase();b.teamX.color=v.xc;b.teamX.logo=v.xlogo;b.mode=v.mode;b.rules=v.rules;if(v.pinHash){b.pinSalt=v.pinSalt;b.pinHash=v.pinHash;delete b.pin;}appendAudit(b,"settings","");});}).then(function(){closeSheet();render();toast("Board saved");}).catch(function(e){toast(e.message,true);});};
  if(el("a_export"))el("a_export").onclick=function(){var data=JSON.stringify(state.board,null,2),blob=new Blob([data],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="slo-points-"+state.board.id+".json";a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);toast("Backup downloaded");};
  if(el("a_import"))el("a_import").onclick=function(){el("a_file").click();};
  if(el("a_file"))el("a_file").onchange=function(e){var f=e.target.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){try{var b=migrate(JSON.parse(fr.result));if(!b||!b.id||!b.squares)throw new Error("bad");state.boardId=b.id;saveNewBoard(b).then(function(){setHash(b.id);closeSheet();render();toast("Board restored");}).catch(function(x){toast(x.message,true);});}catch(err){toast("That is not a SLO Points backup.",true);}};fr.readAsText(f);};
  if(el("a_new"))el("a_new").onclick=function(){if(confirm("Create a new points board? The current board stays saved.")){closeSheet();createBoardFlow();}};
  if(editable&&el("a_clear"))el("a_clear").onclick=function(){if(!confirm("Clear every square?"))return;mutate(function(b){assertOpen(b);b.squares={};appendAudit(b,"clear","");}).then(function(){closeSheet();render();toast("Board cleared");}).catch(function(e){toast(e.message,true);});};
}
function bindLayout(editable){Array.prototype.forEach.call(document.querySelectorAll("[data-grid]"),function(btn){btn.onclick=function(){if(!editable||reservedCount(state.board))return toast("Grid size freezes after the first claim.",true);var p=btn.getAttribute("data-grid").split("x");mutate(function(b){assertOpen(b);if(reservedCount(b))throw new Error("Grid size freezes after the first claim.");b.cols=Number(p[0]);b.rows=Number(p[1]);b.allowedCells=allowedCellsFor(b.cols,b.rows);b.digits={x:null,y:null,drawnAt:null};appendAudit(b,"resize",p.join("x"));}).then(function(){closeSheet();render();toast("Grid updated");}).catch(function(e){toast(e.message,true);});};});if(el("l_swap"))el("l_swap").onclick=function(){if(!editable||reservedCount(state.board))return toast("Team placement freezes after the first claim.",true);if(!confirm("Swap which team appears on the rows and columns?"))return;mutate(function(b){assertOpen(b);if(reservedCount(b))throw new Error("Team placement freezes after the first claim.");var t=b.teamX;b.teamX=b.teamY;b.teamY=t;appendAudit(b,"swap","");}).then(function(){closeSheet();render();toast("Teams swapped");}).catch(function(e){toast(e.message,true);});};}
function bindRewards(editable){if(editable&&el("r_save"))el("r_save").onclick=function(){var vals=Array.prototype.map.call(document.querySelectorAll("[data-r]"),function(inp){return{i:Number(inp.getAttribute("data-r")),f:inp.getAttribute("data-f"),v:inp.value};});mutate(function(b){assertOpen(b);vals.forEach(function(x){if(!b.rewards[x.i])return;if(x.f==="label")b.rewards[x.i].label=x.v.trim()||b.rewards[x.i].label;else b.rewards[x.i][x.f]=Math.max(0,Number(x.v)||0);});appendAudit(b,"rewards","");}).then(function(){closeSheet();render();toast("Point values saved");}).catch(function(e){toast(e.message,true);});};}
function bindNumbers(){if(el("n_lock"))el("n_lock").onclick=lockBoard;if(el("n_draw"))el("n_draw").onclick=runDraw;if(el("n_unlock"))el("n_unlock").onclick=unlockBoard;if(el("n_reset"))el("n_reset").onclick=resetDraw;}
function bindScores(){if(el("s_save"))el("s_save").onclick=function(){var vals=Array.prototype.map.call(document.querySelectorAll("[data-s]"),function(inp){return{k:inp.getAttribute("data-s"),t:inp.getAttribute("data-t"),v:inp.value};});mutate(function(b){assertTrial(b);if(!b.digits.x)throw new Error("Draw numbers first.");vals.forEach(function(x){if(!b.scores[x.k])b.scores[x.k]={x:null,y:null};b.scores[x.k][x.t]=x.v===""?null:Math.max(0,Number(x.v)||0);});if(b.scores.final.x!=null&&b.scores.final.y!=null)b.status="finished";else if(b.status==="finished")b.status="drawn";appendAudit(b,"scores","");}).then(function(){closeSheet();render();toast("Scores saved");}).catch(function(e){toast(e.message,true);});};}
function bindFirebase(){
  function copy(){var t=el("fb_rules");t.select();if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(function(){toast("Secure rules copied");});}
  function values(){return {url:el("fb_url").value.trim().replace(/\/+$/,""),key:el("fb_key").value.trim()};}
  if(el("fb_copy"))el("fb_copy").onclick=copy;
  if(el("fb_test"))el("fb_test").onclick=function(){
    var v=values();if(!v.url||!v.key)return toast("Enter the Database URL and Web API Key first",true);
    var btn=el("fb_test"),old={url:FB.url,key:FB.key},oldAuth=FBAUTH;btn.disabled=true;btn.textContent="Checking";FB={url:v.url,key:v.key};FBAUTH=null;
    ensureFirebaseAuth().then(function(){return firebaseFetch(fbPath("boards","__connection_test__"));}).then(function(r){
      if(r.ok)return toast("Anonymous auth and database reads are working");
      if(r.status===401||r.status===403)throw new Error("Authentication worked, but Database Rules blocked the read. Paste the rules below.");
      throw new Error("Firebase returned "+r.status+".");
    }).catch(function(e){toast(e.message,true);}).finally(function(){FB=old;FBAUTH=oldAuth;btn.disabled=false;btn.textContent="Test auth & rules";});
  };
  if(el("fb_save"))el("fb_save").onclick=function(){
    var v=values();if(!v.url||!v.key)return toast("Enter the Database URL and Web API Key first",true);
    var local=state.board,oldMode=Store.mode,old={url:FB.url,key:FB.key},oldAuth=FBAUTH,oldOwner=local.ownerUid,btn=el("fb_save");
    btn.disabled=true;btn.textContent="Authenticating";FB={url:v.url,key:v.key};FBAUTH=null;authPromise=null;Store.mode="firebase";etags={};
    ensureFirebaseAuth().then(function(a){local.ownerUid=a.uid;btn.textContent="Uploading";return saveNewBoard(local);}).then(function(check){
      var p=prefs(),admins=p.admins||{};admins[check.id]=true;savePrefs({fb:{url:v.url,key:v.key},lastBoard:check.id,admins:admins});state.isAdmin=true;state.syncErr="";setHash(check.id);closeSheet();render();toast("Firebase connected, secured, and upload verified");
    }).catch(function(e){local.ownerUid=oldOwner;FB=old;FBAUTH=oldAuth;Store.mode=oldMode;etags={};toast(e.message,true);btn.disabled=false;btn.textContent="Connect & upload";});
  };
  if(el("fb_clear"))el("fb_clear").onclick=function(){
    if(!confirm("Disconnect Firebase on this device? The remote board is not deleted."))return;
    var copyBoard=state.board;savePrefs({fb:null});FB={url:"",key:""};FBAUTH=null;authPromise=null;etags={};Store.mode=Store.localOk()?"local":"memory";
    Store.set(copyBoard.id,copyBoard).then(function(){setHash(copyBoard.id);closeSheet();render();toast("Firebase disconnected; a local copy was saved");});
  };
}

/* ---------------- sharing/theme/boot ---------------- */
function doShare(){
  if(!state.board)return toast("Create a board first",true);var url=shareUrl(state.board.id);
  if(!url)return openSheet('<div class="sheethead"><h3>Connect Firebase first</h3><p>A local file cannot keep multiple phones synchronized.</p></div><div class="note">Open Organizer → Firebase, connect your Realtime Database, and verify the upload. Then Share will create the live board link.</div>');
  var text=state.board.name+", "+state.board.teamY.short+" vs "+state.board.teamX.short+". Free points squares — no money. "+(totalSquares(state.board)-reservedCount(state.board))+" open.";
  if(navigator.share){navigator.share({title:"SLO Points Squares",text:text,url:url}).catch(function(){});return;}
  if(navigator.clipboard)navigator.clipboard.writeText(text+" "+url).then(function(){toast("Live link copied");}).catch(function(){prompt("Copy this link",url);});else prompt("Copy this link",url);
}
function applyTheme(){document.documentElement.setAttribute("data-theme",state.theme);var map={auto:["◐","Auto"],light:["☀","Day"],dark:["☾","Night"]},m=map[state.theme]||map.auto;el("themeIcon").textContent=m[0];el("themeWord").textContent=m[1];el("themeBtn").classList.toggle("on",state.theme!=="auto");}
function loadBoard(id){
  state.boardId=id;state.board=null;state.isAdmin=false;render();
  return Store.get(id).then(function(b){if(!b){toast("No board found for code "+id,true);state.boardId=null;render();return;}state.board=b;touchIndex(b);savePrefs({lastBoard:id});var admins=prefs().admins||{};state.isAdmin=!!admins[id]&&isFirebaseOwner(b);setHash(id);render();}).catch(function(e){toast(e.message,true);state.boardId=null;render();});
}
function boot(){
  var p=prefs(),sm=location.hash.match(/[#&]s=([A-Za-z0-9\-_]+)/),cfg=sm?decodeSync(sm[1]):null;
  if(cfg){FB={url:cfg.url,key:cfg.key};savePrefs({fb:FB});}else if(p.fb&&p.fb.url&&p.fb.key)FB=p.fb;
  state.deviceId=p.deviceId||uid(12);if(!p.deviceId)savePrefs({deviceId:state.deviceId});state.me=p.me||"";state.theme=p.theme||"auto";applyTheme();appTrial();
  try{state.index=JSON.parse(localStorage.getItem(IDX))||[];}catch(e){state.index=[];}
  Store.init().then(function(){var m=location.hash.match(/b=([a-z0-9]+)/i),id=m?m[1]:(p.lastBoard||null);if(!id){render();return;}return loadBoard(id);}).catch(function(){render();toast("Storage did not start. Changes will not save.",true);});
  setInterval(function(){if(!document.hidden&&!sheetOpen)pull();},3500);window.addEventListener("focus",pull);document.addEventListener("visibilitychange",function(){if(!document.hidden)pull();});window.addEventListener("hashchange",function(){var m=location.hash.match(/b=([a-z0-9]+)/i);if(m&&m[1]!==state.boardId)loadBoard(m[1]);});
}

el("scrim").onclick=closeSheet;document.addEventListener("keydown",function(e){if(e.key==="Escape"&&sheetOpen)closeSheet();});
el("themeBtn").onclick=function(){state.theme=state.theme==="auto"?"light":state.theme==="light"?"dark":"auto";savePrefs({theme:state.theme});applyTheme();};
el("shareBtn").onclick=doShare;
el("adminBtn").onclick=function(){if(!state.board)return toast("Create a board first",true);if(state.isAdmin)openAdmin("setup");else openPin(function(){openAdmin("setup");});};

boot();
})();
